name: 每日更新八大公股銀行資料

on:
  schedule:
    # 台灣時間 18:30（UTC 10:30），週一至週五盤後執行
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Fetch 八大公股銀行資料（Playwright）
        run: |
          node << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              locale: 'zh-TW',
            });

            // 隱藏 webdriver 旗標，避免 Cloudflare 偵測
            await context.addInitScript(() => {
              Object.defineProperty(navigator, 'webdriver', { get: () => false });
            });

            const page = await context.newPage();

            // 先設好等待 trend-data 回應（在 goto 之前，避免錯過）
            const responsePromise = page.waitForResponse(
              r => r.url().includes('trend-data') && r.status() === 200,
              { timeout: 90000 }
            );

            console.log('Navigating to wantgoo...');
            await page.goto('https://www.wantgoo.com/stock/public-bank/trend', {
              waitUntil: 'load',
              timeout: 90000,
            });

            console.log('Waiting for trend-data API response...');
            const apiResponse = await responsePromise;
            const bankData = await apiResponse.json();
            console.log(`API response received: ${bankData.length} records`);

            if (!Array.isArray(bankData) || bankData.length === 0) {
              throw new Error('Invalid data: ' + JSON.stringify(bankData).slice(0, 100));
            }

            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync('data/public-bank.json', JSON.stringify(bankData));
            console.log(`OK: ${bankData.length} records, latest: ${bankData[0].date.slice(0,10)}`);

            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          EOF

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/public-bank.json
          git diff --staged --quiet || git commit -m "data: 更新八大公股銀行資料 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          git push
