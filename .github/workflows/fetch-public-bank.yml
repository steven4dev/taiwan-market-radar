name: 每日更新八大公股銀行資料

on:
  schedule:
    # 台灣時間 18:30（UTC 10:30），週一至週五盤後執行
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Fetch 八大公股銀行資料（Playwright）
        run: |
          node << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              locale: 'zh-TW',
            });

            const page = await context.newPage();

            // 攔截 trend-data API 回應
            let bankData = null;
            page.on('response', async (response) => {
              if (response.url().includes('trend-data') && response.status() === 200) {
                try { bankData = await response.json(); } catch(e) {}
              }
            });

            console.log('Navigating to wantgoo...');
            await page.goto('https://www.wantgoo.com/stock/public-bank/trend', {
              waitUntil: 'networkidle',
              timeout: 60000,
            });

            // 若攔截失敗，從頁面 context 直接 fetch（已有 cookie，不受 CORS 限制）
            if (!bankData) {
              console.log('Interceptor missed, fetching via page context...');
              bankData = await page.evaluate(async () => {
                const r = await fetch('/stock/public-bank/trend-data?market=-1', {
                  headers: { 'Accept': 'application/json' }
                });
                return r.json();
              });
            }

            if (!Array.isArray(bankData) || bankData.length === 0) {
              throw new Error('Invalid data: ' + JSON.stringify(bankData).slice(0, 100));
            }

            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync('data/public-bank.json', JSON.stringify(bankData));
            console.log(`OK: ${bankData.length} records, latest: ${bankData[0].date.slice(0,10)}`);

            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          EOF

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/public-bank.json
          git diff --staged --quiet || git commit -m "data: 更新八大公股銀行資料 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          git push
