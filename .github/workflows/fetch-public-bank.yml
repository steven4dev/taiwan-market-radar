name: 每日更新八大公股銀行資料

on:
  schedule:
    # 台灣時間 18:30（UTC 10:30），週一至週五盤後執行
    - cron: '30 10 * * 1-5'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cloudscraper
        run: pip install cloudscraper

      - name: Fetch 八大公股銀行資料
        run: |
          python3 << 'EOF'
          import cloudscraper, json, sys

          scraper = cloudscraper.create_scraper(
              browser={'browser': 'chrome', 'platform': 'windows', 'mobile': False}
          )
          headers = {
              'Referer': 'https://www.wantgoo.com/stock/public-bank/trend',
              'Accept': 'application/json, text/plain, */*',
              'Accept-Language': 'zh-TW,zh;q=0.9,en-US;q=0.8,en;q=0.7',
          }

          # 先訪問主頁取得 cookie
          scraper.get('https://www.wantgoo.com/stock/public-bank/trend', headers=headers)

          # 抓 API
          r = scraper.get(
              'https://www.wantgoo.com/stock/public-bank/trend-data?market=-1',
              headers=headers
          )
          print(f'Status: {r.status_code}')
          print(f'Preview: {r.text[:200]}')

          data = r.json()
          assert isinstance(data, list) and len(data) > 0, f'Invalid data: {str(data)[:100]}'

          import os
          os.makedirs('data', exist_ok=True)
          with open('data/public-bank.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False)

          print(f'OK: {len(data)} records, latest: {data[0]["date"][:10]}')
          EOF

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/public-bank.json
          git diff --staged --quiet || git commit -m "data: 更新八大公股銀行資料 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          git push
