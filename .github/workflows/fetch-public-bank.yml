name: 每日更新八大公股銀行資料

on:
  schedule:
    # 台灣時間 18:30（UTC 10:30），週一至週五盤後執行
    - cron: '30 10 * * 1-5'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch 八大公股銀行資料（帶 cookie）
        run: |
          mkdir -p data

          # Step 1：先訪問主頁，取得 session cookie
          curl -s -c /tmp/wantgoo_cookie.txt \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: zh-TW,zh;q=0.9,en;q=0.8" \
            "https://www.wantgoo.com/stock/public-bank/trend" \
            -o /dev/null

          # Step 2：帶 cookie 抓 API
          curl -s -b /tmp/wantgoo_cookie.txt \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Accept-Language: zh-TW,zh;q=0.9,en;q=0.8" \
            -H "Referer: https://www.wantgoo.com/stock/public-bank/trend" \
            -H "X-Requested-With: XMLHttpRequest" \
            "https://www.wantgoo.com/stock/public-bank/trend-data?market=-1" \
            -o data/public-bank.json

          echo "--- Response preview ---"
          head -c 200 data/public-bank.json

          # Step 3：驗證 JSON
          python3 -c "
          import json
          with open('data/public-bank.json') as f:
              d = json.load(f)
          assert isinstance(d, list) and len(d) > 0, f'Invalid: {str(d)[:100]}'
          print(f'OK: {len(d)} records, latest: {d[0][\"date\"][:10]}')
          "

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/public-bank.json
          git diff --staged --quiet || git commit -m "data: 更新八大公股銀行資料 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          git push
