  <script type="text/babel">
    const { useState, useEffect } = React;

    // ==========================================
    // Lucide Icons (inline SVG)
    // ==========================================
    const Icon = ({ d, size = 20, className = '' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
        fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
        className={className}>
        {(Array.isArray(d) ? d : [d]).map((path, i) => (
          typeof path === 'string'
            ? <path key={i} d={path} />
            : React.createElement(path.tag || 'path', { key: i, ...path })
        ))}
      </svg>
    );

    const Icons = {
      RefreshCw: ({ size, className }) => <Icon size={size} className={className} d={["M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8","M21 3v5h-5","M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16","M8 16H3v5"]} />,

      ChevronUp: ({ size, className }) => <Icon size={size} className={className} d="m18 15-6-6-6 6" />,
      Activity: ({ size, className }) => <Icon size={size} className={className} d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" />,
      Users: ({ size, className }) => <Icon size={size} className={className} d={["M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2","M16 3.128a4 4 0 0 1 0 7.744","M22 21v-2a4 4 0 0 0-3-3.87",{tag:'circle',cx:'9',cy:'7',r:'4'}]} />,
      PieChart: ({ size, className }) => <Icon size={size} className={className} d={["M21.21 15.89A10 10 0 1 1 8 2.83","M22 12A10 10 0 0 0 12 2v10z"]} />,
      BarChart2: ({ size, className }) => <Icon size={size} className={className} d={[{tag:'line',x1:'18',y1:'20',x2:'18',y2:'10'},{tag:'line',x1:'12',y1:'20',x2:'12',y2:'4'},{tag:'line',x1:'6',y1:'20',x2:'6',y2:'14'},{tag:'line',x1:'2',y1:'20',x2:'22',y2:'20'}]} />,
      TrendingUp: ({ size, className }) => <Icon size={size} className={className} d={["M22 7 13.5 15.5l-5-5L2 17","M16 7h6v6"]} />,
      Globe: ({ size, className }) => <Icon size={size} className={className} d={[{tag:'circle',cx:'12',cy:'12',r:'10'},"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20","M2 12h20"]} />,
      Key: ({ size, className }) => <Icon size={size} className={className} d={[{tag:'circle',cx:'7.5',cy:'15.5',r:'5.5'},"M21 2l-9.6 9.6","M15.5 7.5l3 3L22 7l-3-3"]} />,
      AlertCircle: ({ size, className }) => <Icon size={size} className={className} d={[{tag:'circle',cx:'12',cy:'12',r:'10'},"M12 8v4","M12 16h.01"]} />,
      CheckCircle2: ({ size, className }) => <Icon size={size} className={className} d={[{tag:'circle',cx:'12',cy:'12',r:'10'},"m9 12 2 2 4-4"]} />,
      Milestone: ({ size, className }) => <Icon size={size} className={className} d={["M12 13V2l8 4-8 4",{tag:'path',d:"M20.55 10.23A9 9 0 1 1 8 4.94"},"M8 10a5 5 0 1 0 8.9 2.02"]} />,
      LineChart: ({ size, className }) => <Icon size={size} className={className} d={['M3 3v18h18', 'm19 9-5 5-4-4-3 3']} />,
      Crosshair: ({ size, className }) => <Icon size={size} className={className} d={[{tag:'circle',cx:'12',cy:'12',r:'10'},'M22 12h-4','M6 12H2','M12 6V2','M12 22v-4']} />,
      Flag: ({ size, className }) => <Icon size={size} className={className} d={["M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z","M4 22v-7"]} />,
      Building2: ({ size, className }) => <Icon size={size} className={className} d={[{tag:'rect',width:'16',height:'20',x:'4',y:'2',rx:'2',ry:'2'},"M9 22v-4h6v4","M8 6h.01","M16 6h.01","M12 6h.01","M12 10h.01","M8 10h.01","M16 10h.01","M12 14h.01","M8 14h.01","M16 14h.01"]} />,
      Moon: ({ size, className }) => <Icon size={size} className={className} d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />,
    };

    // ==========================================
    // 1. 設定與工具函數
    // ==========================================
    const DEFAULT_FINMIND_TOKEN = "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJkYXRlIjoiMjAyNi0wMi0wOCAyMzoyODoyMSIsInVzZXJfaWQiOiJzdGV2ZW40ZGV2IiwiZW1haWwiOiJzdGV2ZW40ZGV2QGdtYWlsLmNvbSIsImlwIjoiMTExLjcxLjE4LjY5In0.HjXvn-fgUl_piw0GkPNZOwlebOUKPmPmUZTtCqk55b4";

    const MODULE_CONFIG = {
      M1: { weight: 0.16, title: '多空分水嶺',   icon: 'Milestone' },
      M2: { weight: 0.16, title: '權值股健康度', icon: 'Activity' },
      M3: { weight: 0.12, title: '法人動向',     icon: 'Users' },
      M4: { weight: 0.10, title: '籌碼面',       icon: 'PieChart' },
      M5: { weight: 0.04, title: '量能結構',     icon: 'BarChart2' },
      M6: { weight: 0.04, title: '技術面',       icon: 'TrendingUp' },
      M7: { weight: 0.06, title: '外部環境',     icon: 'Globe' },
      M8: { weight: 0.08, title: '公股銀行動向', icon: 'Building2' },
      M9: { weight: 0.12, title: '夜盤動向',     icon: 'Moon' },
      M10: { weight: 0.06, title: '外資持股比重', icon: 'Flag' },
      M11: { weight: 0.06, title: 'MACD+KD 短線時機', icon: 'Crosshair', wideWhenExpanded: true },
      M12: { weight: 0, title: '外資持股比重 vs 加權指數（長期）', icon: 'LineChart', wide: true },
    };

    const SCORE_LABELS = [
      { min: 80, label: '強烈看多', color: 'text-red-500',    bg: 'bg-red-500' },
      { min: 60, label: '偏多',     color: 'text-red-400',    bg: 'bg-red-400' },
      { min: 40, label: '中立觀望', color: 'text-yellow-500', bg: 'bg-yellow-500' },
      { min: 20, label: '偏空',     color: 'text-green-400',  bg: 'bg-green-400' },
      { min: 0,  label: '強烈看空', color: 'text-green-500',  bg: 'bg-green-500' },
    ];

    const calculateSMA = (data, period, key = 'close') =>
      data.map((item, index) => {
        if (index < period - 1) return { ...item, [`sma${period}`]: null };
        let sum = 0;
        for (let i = 0; i < period; i++) sum += data[index - i][key];
        return { ...item, [`sma${period}`]: sum / period };
      });

    const calculateEMA = (data, period, key = 'close', emaKey) => {
      const k = 2 / (period + 1);
      let ema = data[0][key];
      return data.map((item, index) => {
        if (index === 0) return { ...item, [emaKey]: ema };
        ema = item[key] * k + ema * (1 - k);
        return { ...item, [emaKey]: ema };
      });
    };

    const calculateMACD = (data) => {
      let res = calculateEMA(data, 12, 'close', 'ema12');
      res = calculateEMA(res, 26, 'close', 'ema26');
      res = res.map(d => ({ ...d, dif: d.ema12 - d.ema26 }));
      res = calculateEMA(res, 9, 'dif', 'macd');
      return res.map(d => ({ ...d, osc: d.dif - d.macd }));
    };

    // M11：MACD 自訂參數（DIF = EMA短 − EMA長；慢線 = DIF 的 EMA；柱體 = DIF − 慢線）
    const calculateMACDCustom = (data, shortN, longN, signalN) => {
      let res = calculateEMA(data, shortN, 'close', 'emaS');
      res = calculateEMA(res, longN, 'close', 'emaL');
      res = res.map(d => ({ ...d, dif: d.emaS - d.emaL }));
      res = calculateEMA(res, signalN, 'dif', 'sig');
      return res.map(d => ({ ...d, hist: d.dif - d.sig }));
    };

    // KD (9,3,3)：K、D 初值 50
    const calculateKD = (data, n = 9) => {
      let k = 50, d = 50;
      return data.map((row, i) => {
        const win = data.slice(Math.max(0, i - n + 1), i + 1);
        const hi = Math.max(...win.map(x => x.high));
        const lo = Math.min(...win.map(x => x.low));
        const rsv = hi === lo ? 50 : (row.close - lo) / (hi - lo) * 100;
        k = k * 2 / 3 + rsv / 3;
        d = d * 2 / 3 + k / 3;
        return { ...row, k, d };
      });
    };

    const getPastDateString = (monthsAgo) => {
      const d = new Date();
      d.setMonth(d.getMonth() - Math.floor(monthsAgo));
      return d.toISOString().split('T')[0];
    };

    // ==========================================
    // 2. SVG 圖表元件
    // ==========================================
    const SvgLineChart = ({ data, lines, height = 150 }) => {
      if (!data || data.length === 0) return null;
      let min = Infinity, max = -Infinity;
      data.forEach(d => lines.forEach(line => {
        if (d[line.key] != null) {
          if (d[line.key] > max) max = d[line.key];
          if (d[line.key] < min) min = d[line.key];
        }
      }));
      const padding = (max === min) ? (max * 0.1 || 1) : (max - min) * 0.1;
      max += padding; min -= padding;

      const width = 1000;
      const dx = data.length > 1 ? width / (data.length - 1) : width;

      const getPath = (key) => {
        let path = '', started = false;
        data.forEach((d, i) => {
          if (d[key] == null) return;
          const x = i * dx;
          const y = height - ((d[key] - min) / (max - min)) * height;
          path += started ? `L ${x} ${y} ` : `M ${x} ${y} `;
          started = true;
        });
        return path;
      };

      return (
        <div className="relative w-full overflow-hidden text-xs" style={{ height }}>
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full overflow-visible" preserveAspectRatio="none">
            {lines.map((line, i) => (
              <path key={i} d={getPath(line.key)} fill="none" stroke={line.color} strokeWidth={line.width || '2'} strokeLinejoin="round" strokeDasharray={line.dash} />
            ))}
          </svg>
          <div className="absolute top-0 left-0 text-gray-500 bg-gray-900/50 px-1 rounded">{max.toFixed(2)}</div>
          <div className="absolute bottom-0 left-0 text-gray-500 bg-gray-900/50 px-1 rounded">{min.toFixed(2)}</div>
        </div>
      );
    };

    const SvgBarChart = ({ data, dataKey, colorFn, height = 120 }) => {
      if (!data || data.length === 0) return null;
      const max = Math.max(...data.map(d => Math.abs(d[dataKey] || 0))) * 1.1 || 1;
      const width = 1000;
      const barW = (width / data.length) * 0.8;
      const spacing = (width / data.length) * 0.2;

      return (
        <div className="relative w-full mt-2" style={{ height }}>
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full" preserveAspectRatio="none">
            <line x1="0" y1={height / 2} x2={width} y2={height / 2} stroke="#4b5563" strokeWidth="1" strokeDasharray="4 4" />
            {data.map((d, i) => {
              if (!Number.isFinite(d[dataKey])) return null; // 無資料（如 volume 未回填）不畫零高度長條
              const val = d[dataKey];
              const barH = (Math.abs(val) / max) * (height / 2);
              const x = i * (barW + spacing);
              const y = val >= 0 ? height / 2 - barH : height / 2;
              return <rect key={i} x={x} y={y} width={barW} height={barH} fill={colorFn(d)} />;
            })}
          </svg>
        </div>
      );
    };

    // M11 圖表：指數 + 買賣標記 / 柱體 / KD
    const M11Chart = ({ data, trades = [], wide = false }) => {
      const n = data.length;
      if (n < 2) return null;
      const { W, PH, HH, KH, GAP, fs } = wide
        ? { W: 1000, PH: 170, HH: 64, KH: 96, GAP: 20, fs: 12 }
        : { W: 380, PH: 120, HH: 50, KH: 70, GAP: 18, fs: 11 };
      const H = PH + HH + KH + GAP * 2;
      const dx = W / n;
      const xAt = i => i * dx + dx / 2;

      const closes = data.map(d => d.close);
      const cMin = Math.min(...closes), cMax = Math.max(...closes);
      const pad = (cMax - cMin) * 0.14 || 1;
      const lo = cMin - pad, hi = cMax + pad;
      const yP = v => PH - ((v - lo) / (hi - lo)) * PH;

      const hY0 = PH + GAP;
      const maxAbs = Math.max(...data.map(d => Math.abs(d.hist))) || 1;
      const hMid = hY0 + HH / 2;

      const kY0 = hY0 + HH + GAP;
      const yK = v => kY0 + KH - (v / 100) * KH;

      const path = key => data.map((d, i) => `${i ? 'L' : 'M'} ${xAt(i)} ${yK(d[key])}`).join(' ');
      const pricePath = data.map((d, i) => `${i ? 'L' : 'M'} ${xAt(i)} ${yP(d.close)}`).join(' ');

      // 金叉／死叉：KD＝K 與 D 交叉；柱體＝DIF 與訊號線交叉（柱體正負轉換）。紅＝金叉、綠＝死叉
      const showLbl = n <= 140;
      const kdX = [], macdX = [];
      for (let i = 1; i < n; i++) {
        const a = data[i - 1].k - data[i - 1].d, b = data[i].k - data[i].d;
        if (a <= 0 && b > 0) kdX.push({ i, gold: true });
        else if (a >= 0 && b < 0) kdX.push({ i, gold: false });
        const ha = data[i - 1].hist, hb = data[i].hist;
        if (ha <= 0 && hb > 0) macdX.push({ i, gold: true });
        else if (ha >= 0 && hb < 0) macdX.push({ i, gold: false });
      }
      const xMark = (key, x, y, gold, up) => {
        const col = gold ? '#ef4444' : '#22c55e';
        const txt = gold ? '金叉' : '死叉';
        const tw = 28, th = 13;
        const ty = up ? y - 8 - th : y + 8;
        return (
          <g key={key}>
            <line x1={x} x2={x} y1={y - 12} y2={y + 12} stroke={col} strokeWidth="1" strokeDasharray="2 2" opacity="0.7" />
            <circle cx={x} cy={y} r="4.5" fill="#111827" stroke={col} strokeWidth="2" />
            {showLbl && (
              <g>
                <rect x={x - tw / 2} y={ty} width={tw} height={th} rx="3" fill={col} />
                <text x={x} y={ty + 10} fontSize="10" fill="#fff" textAnchor="middle" fontWeight="700">{txt}</text>
              </g>
            )}
          </g>
        );
      };

      return (
        <svg viewBox={`0 0 ${W} ${H + 16}`} className="w-full block">
          <text x="2" y="11" fontSize={fs} fill="#6b7280">加權指數</text>
          <path d={pricePath} fill="none" stroke="#e5e7eb" strokeWidth="1.5" strokeLinejoin="round" />
          {trades.map((t, k) => {
            const up = t.ret >= 0;
            const col = up ? '#ef4444' : '#22c55e';
            const mag = Math.abs(t.ret);
            const w = mag >= 6 ? 3.4 : mag >= 2 ? 2.6 : 1.9;
            const x0 = xAt(t.a), y0 = yP(t.pa), x1 = xAt(t.b), y1 = yP(t.pb);
            const label = `${up ? '+' : ''}${t.ret.toFixed(1)}%`;
            const lw = label.length * 6 + 8;
            const lx = (x0 + x1) / 2, ly = Math.max(2, (y0 + y1) / 2 - 22);
            return (
              <g key={'t' + k}>
                <title>{`${t.open ? '持有中' : '已平倉'}：▲ ${t.d0} 收 ${t.p0.toLocaleString()} → ${t.open ? '最新' : '▼ ' + t.d1} 收 ${t.p1.toLocaleString()}，${label}（以收盤價計，未含手續費與稅）`}</title>
                <line x1={x0} y1={y0} x2={x1} y2={y1} stroke={col} strokeWidth={w} strokeLinecap="round"
                  strokeDasharray={t.open ? '0.1 5.5' : '7 4'} opacity="0.95" />
                {!t.clipped && <circle cx={x0} cy={y0} r="3" fill={col} stroke="#111827" strokeWidth="1.2" />}
                <circle cx={x1} cy={y1} r="3" fill={t.open ? '#111827' : col} stroke={t.open ? col : '#111827'} strokeWidth={t.open ? 1.8 : 1.2} />
                {x1 - x0 >= 36 && (
                  <g>
                    <rect x={lx - lw / 2} y={ly} width={lw} height="14" rx="3" fill="#111827" fillOpacity="0.88" stroke={col} strokeOpacity="0.6" strokeWidth="0.8" />
                    <text x={lx} y={ly + 10.5} fontSize="10" fill={col} textAnchor="middle" fontWeight="600">{label}</text>
                  </g>
                )}
              </g>
            );
          })}
          {data.map((d, i) => d.signal === 'buy' ? (
            <polygon key={'b' + i} fill="#ef4444"
              points={`${xAt(i)},${yP(d.close) + 4} ${xAt(i) - 6},${yP(d.close) + 15} ${xAt(i) + 6},${yP(d.close) + 15}`} />
          ) : d.signal === 'sell' ? (
            <polygon key={'s' + i} fill="#22c55e"
              points={`${xAt(i)},${yP(d.close) - 4} ${xAt(i) - 6},${yP(d.close) - 15} ${xAt(i) + 6},${yP(d.close) - 15}`} />
          ) : null)}

          <text x="2" y={hY0 + 11} fontSize={fs} fill="#6b7280">柱體 (9/12/130)</text>
          <line x1="0" y1={hMid} x2={W} y2={hMid} stroke="#374151" strokeWidth="0.8" />
          {data.map((d, i) => {
            const h = Math.max(0.5, Math.abs(d.hist) / maxAbs * (HH / 2 - 2));
            return <rect key={i} x={i * dx + dx * 0.12} y={d.hist >= 0 ? hMid - h : hMid}
              width={dx * 0.76} height={h} fill={d.hist >= 0 ? '#ef4444' : '#22c55e'} opacity="0.85" />;
          })}

          {macdX.map(c => xMark('mx' + c.i, xAt(c.i), hMid, c.gold, c.gold))}

          <text x="2" y={kY0 + 11} fontSize={fs} fill="#6b7280">KD (9,3,3)</text>
          {[20, 80].map(v => (
            <g key={v}>
              <line x1="0" y1={yK(v)} x2={W} y2={yK(v)} stroke="#4b5563" strokeWidth="0.8" strokeDasharray="3 3" />
              <text x={W - 2} y={yK(v) - 2} fontSize={fs} fill="#6b7280" textAnchor="end">{v}</text>
            </g>
          ))}
          <path d={path('d')} fill="none" stroke="#38bdf8" strokeWidth="1.3" strokeLinejoin="round" />
          <path d={path('k')} fill="none" stroke="#facc15" strokeWidth="1.3" strokeLinejoin="round" />
          {kdX.map(c => xMark('kx' + c.i, xAt(c.i), yK(data[c.i].k), c.gold, !c.gold))}
          <g fontSize={fs}>
            <circle cx={W - 118} cy={kY0 + 8} r="4" fill="#111827" stroke="#ef4444" strokeWidth="2" />
            <text x={W - 110} y={kY0 + 12} fill="#ef4444">金叉 {kdX.filter(c => c.gold).length}</text>
            <circle cx={W - 58} cy={kY0 + 8} r="4" fill="#111827" stroke="#22c55e" strokeWidth="2" />
            <text x={W - 50} y={kY0 + 12} fill="#22c55e">死叉 {kdX.filter(c => !c.gold).length}</text>
          </g>

          <text x="0" y={H + 13} fontSize={fs} fill="#6b7280">{data[0].date}</text>
          <text x={W} y={H + 13} fontSize={fs} fill="#6b7280" textAnchor="end">{data[n - 1].date}</text>
        </svg>
      );
    };

    // M11 策略切換：新＝柱體收斂第 3 根；舊＝柱體正負轉換。摘要與面板共用，並記住上次選擇。
    const m11Store = (() => {
      let v = 'conv';
      try { const x = localStorage.getItem('m11-strategy'); if (x === 'conv' || x === 'cross') v = x; } catch (e) {}
      return {
        subs: new Set(),
        get: () => v,
        set(x) { v = x; try { localStorage.setItem('m11-strategy', x); } catch (e) {} this.subs.forEach(f => f(x)); },
      };
    })();
    const useM11Strategy = () => {
      const [v, setV] = useState(m11Store.get());
      useEffect(() => { m11Store.subs.add(setV); return () => { m11Store.subs.delete(setV); }; }, []);
      return [v, x => m11Store.set(x)];
    };

    const M11Summary = ({ base, info }) => {
      const [strat, setStrat] = useM11Strategy();
      const OPTS = [
        ['conv', '新｜收斂第 3 根', '空手時綠柱連續收斂第 3 根買進；持有時紅柱連續收斂第 3 根賣出'],
        ['cross', '舊｜正負轉換', '柱體由負轉正買進；由正轉負賣出'],
      ];
      return (
        <>
          {base}{info[strat]}
          <div className="mt-3 flex flex-wrap items-center gap-2">
            <span className="text-xs text-gray-500">買賣策略</span>
            <div className="inline-flex rounded-full bg-gray-900 border border-gray-700 p-0.5 text-xs">
              {OPTS.map(([k, label, tip]) => (
                <button key={k} title={tip} onClick={() => setStrat(k)}
                  className={`px-3 py-1 rounded-full whitespace-nowrap transition-colors ${strat === k ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'}`}>
                  {label}
                </button>
              ))}
            </div>
          </div>
        </>
      );
    };

    // M11 面板：區間切換 + 勝率/輸贏統計 + 圖表
    const M11Panel = ({ td }) => {
      const { useMemo } = React;
      const [rangeKey, setRangeKey] = useState('r120');
      const [strat] = useM11Strategy();
      const sigKey = strat === 'conv' ? 'sigConv' : 'sigCross';
      const WARM = 140;                       // 慢線 EMA130 暖機期，其前的訊號不計
      const n = td.length;
      // 日 = 交易日筆數；年 = 日曆年限（自最新日期往前推 N 年）
      const RANGES = [
        { key: 'r60', label: '近 60 日', rows: 60 }, { key: 'r120', label: '近 120 日', rows: 120 },
        { key: 'y1', label: '近 1 年', years: 1 }, { key: 'y3', label: '近 3 年', years: 3 },
        { key: 'all', label: '全部', all: true },
      ];
      const calcSize = r => {
        if (r.all) return n - WARM;
        if (r.years) {
          const d = new Date(td[n - 1].date);
          d.setFullYear(d.getFullYear() - r.years);
          const cut = d.toISOString().slice(0, 10);
          let i = 0;
          while (i < n && td[i].date < cut) i++;
          return n - i;
        }
        return r.rows;
      };
      const cur = RANGES.find(r => r.key === rangeKey) || RANGES[1];
      const size = Math.max(2, Math.min(calcSize(cur), n - WARM));

      const { view, trades, stats, openTrade } = useMemo(() => {
        const viewStart = n - size;
        const raw = [];
        let oi = null;
        td.forEach((d, i) => {
          if (d[sigKey] === 'buy') oi = i;
          else if (d[sigKey] === 'sell' && oi != null) { raw.push({ i0: oi, i1: i, open: false }); oi = null; }
        });
        if (oi != null) raw.push({ i0: oi, i1: n - 1, open: true });

        const trades = raw.filter(t => t.i0 >= WARM && t.i1 >= viewStart).map(t => {
          const p0 = td[t.i0].close, p1 = td[t.i1].close;
          let a = t.i0 - viewStart, pa = p0, clipped = false;
          if (a < 0) { pa = p0 + (p1 - p0) * (-a) / (t.i1 - t.i0); a = 0; clipped = true; }
          return { a, b: t.i1 - viewStart, pa, pb: p1, p0, p1, ret: (p1 / p0 - 1) * 100,
                   open: t.open, clipped, d0: td[t.i0].date, d1: td[t.i1].date };
        });

        const rets = trades.filter(t => !t.open).map(t => t.ret);
        const wins = rets.filter(r => r > 0), losses = rets.filter(r => r <= 0);
        const avg = a => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
        const stats = rets.length ? {
          count: rets.length, wins: wins.length, losses: losses.length,
          winRate: wins.length / rets.length * 100,
          avgWin: avg(wins), avgLoss: avg(losses),
          total: (rets.reduce((e, r) => e * (1 + r / 100), 1) - 1) * 100,
          best: Math.max(...rets), worst: Math.min(...rets),
        } : null;
        return { view: td.slice(viewStart).map(d => ({ ...d, signal: d[sigKey] })), trades, stats, openTrade: trades.find(t => t.open) || null };
      }, [td, size, sigKey]);

      const sg = v => (v == null ? '—' : `${v > 0 ? '+' : ''}${v.toFixed(1)}%`);
      const rc = v => (v == null ? 'text-gray-400' : v > 0 ? 'text-red-400' : 'text-green-400');
      const tile = (label, value, sub) => (
        <div key={label} className="bg-gray-900/60 border border-gray-700 rounded-lg px-3 py-2">
          <p className="text-[11px] text-gray-500">{label}</p>
          <p className="text-base font-bold text-white leading-snug">{value}</p>
          <p className="text-[11px] text-gray-400">{sub}</p>
        </div>
      );

      return (
        <>
          <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div>
              <p className="text-xs text-gray-300">策略規則：{strat === 'conv'
                ? '空手時綠柱連續收斂第 3 根收盤買進；持有時紅柱連續收斂第 3 根收盤賣出（收斂＝同色柱比前一根短）'
                : '柱體由負轉正收盤買進；由正轉負收盤賣出'}</p>
              <p className="text-xs text-gray-500">統計＝區間內「賣出」的已平倉波段 · 收盤價計，未含手續費與證交稅</p>
            </div>
            <div className="flex flex-wrap gap-1">
              {RANGES.map(r => (
                <button key={r.key} onClick={() => setRangeKey(r.key)}
                  className={`px-3 py-1 rounded-md text-xs border transition-colors ${rangeKey === r.key ? 'bg-blue-600 border-blue-500 text-white' : 'bg-gray-900 border-gray-700 text-gray-400 hover:text-white'}`}>
                  {r.label}
                </button>
              ))}
            </div>
          </div>
          {stats ? (
            <div className="grid grid-cols-2 md:grid-cols-5 gap-2 mb-2">
              {tile('已平倉', `${stats.count} 次`,
                <><span className="text-red-400">獲利 {stats.wins}</span>{' · '}<span className="text-green-400">虧損 {stats.losses}</span></>)}
              {tile('勝率', `${stats.winRate.toFixed(0)}%`,
                stats.avgWin != null && stats.avgLoss != null && stats.avgLoss < 0
                  ? `盈虧比 ${(stats.avgWin / Math.abs(stats.avgLoss)).toFixed(2)}` : '盈虧比 —')}
              {tile('平均每筆',
                <span className="text-sm"><span className={rc(stats.avgWin)}>{sg(stats.avgWin)}</span>{' / '}<span className={rc(stats.avgLoss)}>{sg(stats.avgLoss)}</span></span>,
                '平均獲利 / 平均虧損')}
              {tile('累計報酬', <span className={rc(stats.total)}>{sg(stats.total)}</span>, '各波段依序複利')}
              {tile('單筆極值',
                <span className="text-sm"><span className={rc(stats.best)}>{sg(stats.best)}</span>{' / '}<span className={rc(stats.worst)}>{sg(stats.worst)}</span></span>,
                '最佳 / 最差')}
            </div>
          ) : (
            <p className="text-sm text-gray-500 mb-2">此區間內尚無已平倉波段。</p>
          )}
          <p className="text-xs text-gray-400 mb-3">
            {openTrade
              ? <>目前持有中：▲ {openTrade.d0} 進場，未實現 <span className={rc(openTrade.ret)}>{sg(openTrade.ret)}</span>（不計入上列統計）。</>
              : '目前空手。'}
          </p>
          <div className="md:hidden"><M11Chart data={view} trades={trades} /></div>
          <div className="hidden md:block"><M11Chart data={view} trades={trades} wide /></div>
        </>
      );
    };

    // M12 圖表：外資持股比重 vs 加權指數（長期，雙軸各自自動縮放；X 軸依日期比例排列）
    const ForeignLongChart = ({ rows }) => {
      const { useMemo, useRef, useCallback } = React;
      const [years, setYears] = useState(5);
      const [hov, setHov] = useState(null);
      const boxRef = useRef(null);
      const DAILY_FROM = '2021-11-01';          // 此日期之前的資料為每週一筆

      const cutoff = useMemo(() => {
        const d = new Date(rows[rows.length - 1].date);
        d.setFullYear(d.getFullYear() - years);
        return d.toISOString().slice(0, 10);
      }, [rows, years]);
      const DAY = 864e5, MA_S = 30, MA_L = 90;
      const withMa = useMemo(() => {
        const t = rows.map(d => Date.parse(d.date));
        const ma = W => {
          let j = 0, sum = 0;
          return rows.map((d, i) => {
            sum += d.ratio;
            while (t[j] <= t[i] - W * DAY) { sum -= rows[j].ratio; j++; }
            return sum / (i - j + 1);
          });
        };
        const ms = ma(MA_S), ml = ma(MA_L);
        return rows.map((d, i) => ({ ...d, ms: ms[i], ml: ml[i] }));
      }, [rows]);
      const view = useMemo(() => withMa.filter(d => d.date >= cutoff), [withMa, cutoff]);
      const covered = rows[0].date <= cutoff;
      const n = view.length;
      const ts = useMemo(() => view.map(d => Date.parse(d.date)), [view]);

      const onMove = useCallback(e => {
        if (!boxRef.current || ts.length < 2) return;
        const rect = boxRef.current.getBoundingClientRect();
        const f = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
        const target = ts[0] + f * (ts[ts.length - 1] - ts[0]);
        let lo = 0, hi = ts.length - 1;
        while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (ts[mid] <= target) lo = mid; else hi = mid; }
        setHov(Math.abs(ts[lo] - target) <= Math.abs(ts[hi] - target) ? lo : hi);
      }, [ts]);

      const RANGES = [{ label: '1 年', y: 1 }, { label: '3 年', y: 3 }, { label: '5 年', y: 5 }, { label: '10 年', y: 10 }, { label: '15 年', y: 15 }];
      if (n < 2) return <p className="text-gray-500 text-sm text-center py-6">資料不足。</p>;

      const W = 1000, H = 300;
      const span = ts[n - 1] - ts[0];
      const fx = i => (ts[i] - ts[0]) / span;
      const scale = vals => {
        const mn = Math.min(...vals), mx = Math.max(...vals);
        const pd = (mx - mn) * 0.06 || 1;
        return { lo: mn - pd, hi: mx + pd };
      };
      const rs = scale(view.map(d => d.ratio));
      const idxVals = view.map(d => d.index).filter(v => v != null);
      const is = idxVals.length ? scale(idxVals) : null;
      const mk = (key, sc) => {
        let path = '', started = false;
        view.forEach((d, i) => {
          if (d[key] == null) return;
          const y = H - ((d[key] - sc.lo) / (sc.hi - sc.lo)) * H;
          path += `${started ? 'L' : 'M'} ${(fx(i) * W).toFixed(1)} ${y.toFixed(1)} `;
          started = true;
        });
        return path;
      };
      const fr = [0, 0.25, 0.5, 0.75, 1];
      const last = view[n - 1];
      const hiR = view.reduce((m, d) => (d.ratio > m.ratio ? d : m), view[0]);
      const loR = view.reduce((m, d) => (d.ratio < m.ratio ? d : m), view[0]);
      // 金叉／死叉：30 日均線自下穿越 90 日均線＝金叉；自上穿越＝死叉（資料起點後 90 日內均線未成形，不計）
      const warmTs = Date.parse(rows[0].date) + MA_L * DAY;
      const crosses = [];
      for (let i = 1; i < n; i++) {
        if (ts[i - 1] < warmTs) continue;
        const a = view[i - 1].ms - view[i - 1].ml, b = view[i].ms - view[i].ml;
        if (a <= 0 && b > 0) crosses.push({ i, gold: true });
        else if (a >= 0 && b < 0) crosses.push({ i, gold: false });
      }
      const nGold = crosses.filter(c => c.gold).length;
      const showLbl = crosses.length <= 30;
      const tickTs = Array.from({ length: 7 }, (_, k) => ts[0] + (span * k) / 6);
      const hd = hov != null ? view[hov] : null;
      const tipLeft = hov != null && fx(hov) > 0.6;

      return (
        <>
          <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
            <p className="text-xs text-gray-400">
              最新 <span className="text-blue-400 font-bold">{last.ratio.toFixed(2)}%</span>（{last.date}）
              {' · '}區間高 {hiR.ratio.toFixed(2)}%（{hiR.date}）{' · '}區間低 {loR.ratio.toFixed(2)}%（{loR.date}）
              {view[0].date < DAILY_FROM && <span className="text-gray-500">{' · '}{DAILY_FROM.slice(0, 7)} 之前為每週一筆</span>}
              {' · '}<span className="text-red-400">金叉 {nGold}</span> / <span className="text-green-400">死叉 {crosses.length - nGold}</span>
              <span className="text-gray-500">（30 日均線穿越 90 日均線）</span>
              {!covered && <span className="text-yellow-500">{' · '}資料自 {rows[0].date} 起，未涵蓋完整 {years} 年</span>}
            </p>
            <div className="flex flex-wrap gap-1">
              {RANGES.map(r => (
                <button key={r.y} onClick={() => setYears(r.y)}
                  className={`px-3 py-1 rounded-md text-xs border transition-colors ${years === r.y ? 'bg-blue-600 border-blue-500 text-white' : 'bg-gray-900 border-gray-700 text-gray-400 hover:text-white'}`}>
                  {r.label}
                </button>
              ))}
            </div>
          </div>
          <div className="flex">
            <div className="relative flex-shrink-0 text-xs text-blue-400 select-none" style={{ width: '3.2rem', height: H }}>
              {fr.map(f => (
                <span key={f} className="absolute right-1" style={{ top: `${f * 100}%`, transform: 'translateY(-50%)' }}>
                  {(rs.hi - f * (rs.hi - rs.lo)).toFixed(1)}%
                </span>
              ))}
            </div>
            <div ref={boxRef} className="flex-1 relative cursor-crosshair" style={{ height: H }}
              onMouseMove={onMove} onMouseLeave={() => setHov(null)}>
              <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" className="w-full h-full block overflow-visible">
                {fr.map(f => (
                  <line key={f} x1="0" x2={W} y1={f * H} y2={f * H} stroke="#374151" strokeWidth="1" strokeDasharray="3 4" vectorEffect="non-scaling-stroke" />
                ))}
                {is && <path d={mk('index', is)} fill="none" stroke="#f87171" strokeWidth="1.3" strokeDasharray="4 3" vectorEffect="non-scaling-stroke" />}
                <path d={mk('ml', rs)} fill="none" stroke="#a78bfa" strokeWidth="1.2" strokeDasharray="5 3" vectorEffect="non-scaling-stroke" opacity="0.9" />
                <path d={mk('ms', rs)} fill="none" stroke="#facc15" strokeWidth="1.2" vectorEffect="non-scaling-stroke" opacity="0.9" />
                <path d={mk('ratio', rs)} fill="none" stroke="#60a5fa" strokeWidth="2" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />
                {hov != null && <line x1={fx(hov) * W} x2={fx(hov) * W} y1="0" y2={H} stroke="#9ca3af" strokeWidth="1" vectorEffect="non-scaling-stroke" />}
              </svg>
              {crosses.map(c => {
                const col = c.gold ? '#ef4444' : '#22c55e';
                const v = view[c.i].ms;
                const top = (1 - (v - rs.lo) / (rs.hi - rs.lo)) * 100;
                return (
                  <div key={c.i} className="absolute pointer-events-none" style={{ left: `${fx(c.i) * 100}%`, top: `${top}%`, transform: 'translate(-50%,-50%)' }}>
                    <div style={{ width: 11, height: 11, borderRadius: '50%', background: '#111827', border: `2.5px solid ${col}` }} />
                    {showLbl && (
                      <span className="absolute left-1/2 text-[10px] font-bold text-white rounded px-1 whitespace-nowrap"
                        style={{ background: col, transform: 'translateX(-50%)', ...(c.gold ? { top: 14 } : { bottom: 14 }) }}>
                        {c.gold ? '金叉' : '死叉'}
                      </span>
                    )}
                  </div>
                );
              })}
              {hd && (
                <div className="absolute top-2 z-10 pointer-events-none bg-gray-900/90 border border-gray-600 rounded-lg px-3 py-2 text-xs leading-relaxed whitespace-nowrap"
                  style={tipLeft ? { right: `${100 - fx(hov) * 100 + 1}%` } : { left: `${fx(hov) * 100 + 1}%` }}>
                  <div className="text-gray-300 font-bold">{hd.date}</div>
                  <div className="text-blue-400">外資持股占比 {hd.ratio.toFixed(2)}%</div>
                  <div className="text-gray-300">不含台積電 {hd.exTsmc.toFixed(2)}%</div>
                  <div className="text-yellow-400">30 日均 {hd.ms.toFixed(2)}%</div>
                  <div className="text-purple-400">90 日均 {hd.ml.toFixed(2)}%</div>
                  <div className="text-red-400">加權指數 {hd.index != null ? hd.index.toLocaleString() : '—'}</div>
                </div>
              )}
            </div>
            <div className="relative flex-shrink-0 text-xs text-red-400 select-none" style={{ width: '3.8rem', height: H }}>
              {is && fr.map(f => (
                <span key={f} className="absolute left-1" style={{ top: `${f * 100}%`, transform: 'translateY(-50%)' }}>
                  {Math.round(is.hi - f * (is.hi - is.lo)).toLocaleString()}
                </span>
              ))}
            </div>
          </div>
          <div className="relative text-xs text-gray-500 select-none" style={{ height: 18, marginLeft: '3.2rem', marginRight: '3.8rem' }}>
            {tickTs.map((t, k) => (
              <span key={k} className="absolute whitespace-nowrap" style={{ left: `${(k / 6) * 100}%`, transform: 'translateX(-50%)' }}>
                {new Date(t).toISOString().slice(0, 7)}
              </span>
            ))}
          </div>
        </>
      );
    };

    // ==========================================
    // 對齊圖表面板（單一 SVG + 準線 + Tooltip）
    // ==========================================
    const AlignedChartPanel = ({ moduleData }) => {
      const { useMemo, useState, useRef, useCallback } = React;
      const [hovIdx, setHovIdx] = useState(null);
      const chartRef = useRef(null);

      const allDates = useMemo(() => {
        const s = new Set();
        Object.values(moduleData).forEach(d => {
          if (d?.alignedData) d.alignedData.forEach(p => s.add(p.date));
        });
        return [...s].sort().slice(-60);
      }, [moduleData]);

      const n = allDates.length;

      // ⚠️ useCallback 必須在所有 return 之前，不可在 early return 後呼叫
      const handleMouseMove = useCallback(e => {
        if (!chartRef.current || n < 2) return;
        const rect = chartRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const idx = Math.min(n - 1, Math.max(0, Math.round((x / rect.width) * (n - 1))));
        setHovIdx(idx);
      }, [n]);

      if (n < 2) return (
        <p className="text-gray-500 text-sm text-center py-4">等待各模組資料載入中...</p>
      );

      const ROWS_DEF = [
        { id:'M1', label:'大盤',  type:'line', color:'#e5e7eb', fmt: v => v != null ? v.toLocaleString() : '—' },
        { id:'M2', label:'台積電', type:'line', color:'#facc15', fmt: v => v != null ? v.toLocaleString() : '—' },
        { id:'M7', label:'SOX',   type:'line', color:'#38bdf8', fmt: v => v != null ? v.toFixed(1) : '—' },
        { id:'M6', label:'MACD',  type:'bar',  colorFn: v => v > 0 ? '#ef4444' : '#22c55e', fmt: v => v != null ? v.toFixed(1) : '—' },
        { id:'M11', label:'柱體', type:'bar', colorFn: v => v > 0 ? '#ef4444' : '#22c55e', fmt: v => v != null ? v.toFixed(0) : '—' },
        { id:'M9', label:'夜盤',  type:'bar',  colorFn: v => v > 0 ? '#ef4444' : '#22c55e', fmt: v => v != null ? `${v>0?'+':''}${v.toFixed(2)}%` : '—' },
        { id:'M3', label:'外資',  type:'bar',  colorFn: v => v > 0 ? '#ef4444' : '#22c55e', fmt: v => v != null ? `${v>0?'+':''}${v.toFixed(1)}億` : '—' },
        { id:'M10', label:'外資比', type:'line', color:'#60a5fa', fmt: v => v != null ? `${v.toFixed(2)}%` : '—' },
        { id:'M12', label:'扣台積', type:'line', color:'#93c5fd', fmt: v => v != null ? `${v.toFixed(2)}%` : '—' },
        { id:'M4', label:'融資',  type:'line', color:'#c084fc', fmt: v => v != null ? `${Math.round(v)}億` : '—' },
        { id:'M8', label:'公股',  type:'bar',  colorFn: v => v > 0 ? '#ef4444' : '#22c55e', fmt: v => v != null ? `${v>0?'+':''}${v.toFixed(1)}億` : '—' },
        { id:'M5', label:'量能',  type:'bar',  colorFn: v => '#94a3b8',                      fmt: v => v != null ? `${v.toFixed(0)}億` : '—' },
      ];

      // 每個模組都保留一列；沒有資料的列標示「無資料」
      const rows = ROWS_DEF.map(r => {
        const ad = moduleData[r.id]?.alignedData;
        const vals = (ad || []).map(p => p.value).filter(v => v != null && isFinite(v));
        if (!ad || ad.length === 0 || !vals.length)
          return { ...r, empty: true, byDate: {}, vals: [], maxAbs: 1, lineMin: 0, lineMax: 1, lineRange: 1 };
        const byDate = Object.fromEntries(ad.map(p => [p.date, p.value]));
        const maxAbs = r.type === 'bar' ? (Math.max(...vals.map(v => Math.abs(v))) * 1.1 || 1) : null;
        const lineMin = r.type === 'line' ? Math.min(...vals) : null;
        const lineMax = r.type === 'line' ? Math.max(...vals) : null;
        const lineRange = lineMax != null ? (lineMax - lineMin || Math.abs(lineMin) * 0.01 || 1) : null;
        return { ...r, byDate, vals, maxAbs, lineMin, lineMax, lineRange };
      }).filter(Boolean);

      const W = 1000;           // SVG viewBox 寬
      const ROW_H = 52;         // 每列高（SVG 單位）
      const X_H = 22;           // x 軸高
      const TOTAL_H = rows.length * ROW_H + X_H;
      const dx = W / n;
      const barW = dx * 0.72;
      const labelStep = Math.ceil(n / 8);

      const hovDate = hovIdx != null ? allDates[hovIdx] : null;

      // Tooltip 左右側切換
      const tipOnLeft = hovIdx != null && hovIdx > n * 0.62;

      return (
        <section className="mb-8 bg-gray-800 rounded-2xl p-5 border border-gray-700 shadow-xl">
          <div className="flex items-center justify-between mb-1">
            <h3 className="text-lg font-bold text-white">📐 多模組對齊</h3>
          </div>
          <p className="text-sm text-gray-400 mb-3">近 {n} 個交易日 · 滑動查看各模組數值</p>

          {/* 標籤欄 + 圖表區 */}
          <div className="flex gap-0">

            {/* 左側 y 標籤 */}
            <div className="flex flex-col flex-shrink-0" style={{width:'3rem', paddingBottom: X_H}}>
              {rows.map(r => (
                <div key={r.id} className="flex items-center justify-end pr-2 text-xs text-gray-500 select-none" style={{height: 56}}>
                  {r.label}
                </div>
              ))}
            </div>

            {/* 圖表主體 */}
            <div
              ref={chartRef}
              className="flex-1 relative cursor-crosshair"
              onMouseMove={handleMouseMove}
              onMouseLeave={() => setHovIdx(null)}
            >
              <svg
                viewBox={`0 0 ${W} ${TOTAL_H}`}
                className="w-full block"
                style={{height: rows.length * 56 + 28}}
                preserveAspectRatio="none"
              >
                {/* 列分隔線 */}
                {rows.map((_, ri) => (
                  <line key={ri} x1="0" y1={ri * ROW_H} x2={W} y2={ri * ROW_H} stroke="#1f2937" strokeWidth="1" />
                ))}

                {/* 各列資料 */}
                {rows.map((r, ri) => {
                  const yBase = ri * ROW_H;
                  const mid = yBase + ROW_H / 2;
                  if (r.empty) return (
                    <g key={r.id}>
                      <line x1="0" y1={mid} x2={W} y2={mid} stroke="#374151" strokeWidth="0.6" strokeDasharray="6 6" />
                    </g>
                  );
                  return (
                    <g key={r.id}>
                      {r.type === 'bar'
                        ? <>
                            <line x1="0" y1={mid} x2={W} y2={mid} stroke="#374151" strokeWidth="0.6" />
                            {allDates.map((date, i) => {
                              const v = r.byDate[date];
                              if (v == null) return null;
                              const barH = Math.max(1, Math.abs(v / r.maxAbs) * (ROW_H / 2 - 3));
                              const x = i * dx + dx * 0.14;
                              const y = v >= 0 ? mid - barH : mid;
                              const fill = r.colorFn(v);
                              return <rect key={date} x={x} y={y} width={barW} height={barH}
                                fill={fill} opacity={hovIdx === i ? 1 : 0.8} />;
                            })}
                          </>
                        : (() => {
                            let path = '';
                            allDates.forEach((date, i) => {
                              const v = r.byDate[date];
                              if (v == null) return;
                              const x = i * dx + dx / 2;
                              const y = yBase + (ROW_H - 4) - ((v - r.lineMin) / r.lineRange) * (ROW_H - 8);
                              path += path === '' ? `M ${x} ${y}` : ` L ${x} ${y}`;
                            });
                            return (
                              <>
                                <path d={path} fill="none" stroke={r.color} strokeWidth="1.6" strokeLinejoin="round" />
                                {hovIdx != null && (() => {
                                  const v = r.byDate[allDates[hovIdx]];
                                  if (v == null) return null;
                                  const cx = hovIdx * dx + dx / 2;
                                  const cy = yBase + (ROW_H - 4) - ((v - r.lineMin) / r.lineRange) * (ROW_H - 8);
                                  return <circle cx={cx} cy={cy} r="7" fill={r.color} stroke="#1f2937" strokeWidth="2" />;
                                })()}
                              </>
                            );
                          })()
                      }
                    </g>
                  );
                })}

                {/* X 軸 */}
                <g>
                  <line x1="0" y1={rows.length * ROW_H} x2={W} y2={rows.length * ROW_H} stroke="#374151" strokeWidth="1" />
                  {allDates.map((date, i) => {
                    if (i % labelStep !== 0 && i !== n - 1) return null;
                    return (
                      <text key={date} x={i * dx + dx / 2} y={rows.length * ROW_H + 16}
                        textAnchor="middle" fontSize="14" fill="#6b7280">{date.slice(5)}</text>
                    );
                  })}
                </g>

                {/* 準線 */}
                {hovIdx != null && (
                  <>
                    <rect x={hovIdx * dx} y="0" width={dx} height={rows.length * ROW_H}
                      fill="#ffffff" opacity="0.04" />
                    <line
                      x1={hovIdx * dx + dx / 2} y1="0"
                      x2={hovIdx * dx + dx / 2} y2={rows.length * ROW_H}
                      stroke="#ffffff" strokeWidth="0.8" strokeDasharray="4 3" opacity="0.5"
                    />
                    <line
                      x1={hovIdx * dx + dx / 2} y1={rows.length * ROW_H}
                      x2={hovIdx * dx + dx / 2} y2={TOTAL_H}
                      stroke="#ffffff" strokeWidth="0.8" opacity="0.3"
                    />
                  </>
                )}
              </svg>

              {rows.map((r, ri) => r.empty ? (
                <div key={'empty-' + r.id}
                  className="absolute left-0 right-0 flex items-center justify-center text-xs text-gray-500 pointer-events-none"
                  style={{ top: ri * 56, height: 56 }}>
                  無資料（來源載入中或連線失敗）
                </div>
              ) : null)}

              {/* Tooltip */}
              {hovDate && (
                <div
                  className="absolute top-2 pointer-events-none z-20 rounded-xl text-xs p-3 min-w-[148px]"
                  style={{
                    background: 'rgba(0,0,0,0.55)',
                    border: '1px solid rgba(255,255,255,0.20)',
                    boxShadow: '0 4px 20px rgba(0,0,0,0.7)',
                    ...(tipOnLeft
                      ? { right: `${(1 - hovIdx / n) * 100}%`, transform: 'translateX(-12px)' }
                      : { left:  `${(hovIdx + 1) / n * 100}%`, transform: 'translateX(8px)' }),
                  }}
                >
                  <p className="text-white font-bold mb-2 border-b border-gray-700 pb-1">{hovDate}</p>
                  {rows.map(r => {
                    const v = r.byDate[hovDate];
                    const col = r.colorFn
                      ? (v != null ? r.colorFn(v) : '#6b7280')
                      : r.color;
                    const showArrow = (r.id === 'M1' || r.id === 'M7') && v != null && hovIdx > 0;
                    const prevDate = showArrow ? allDates[hovIdx - 1] : null;
                    const prevV = prevDate ? r.byDate[prevDate] : null;
                    const arrow = showArrow && prevV != null
                      ? (v > prevV ? '↗' : v < prevV ? '↘' : '')
                      : '';
                    const arrowCol = arrow === '↗' ? '#ef4444' : arrow === '↘' ? '#22c55e' : '';
                    return (
                      <div key={r.id} className="flex justify-between items-center gap-4 mb-1">
                        <span className="text-gray-400">{r.label}</span>
                        <span className="font-mono font-semibold" style={{color: col}}>
                          {arrow && <span style={{color: arrowCol, marginRight: '3px'}}>{arrow}</span>}
                          {r.fmt(v)}
                        </span>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>

          {/* 底部導覽列：毛玻璃 ◀ 日期 ▶ */}
          <div className="mt-3 flex items-center justify-center gap-3">
            <button
              onClick={() => setHovIdx(i => Math.max(0, (i ?? n - 1) - 1))}
              disabled={hovIdx === 0}
              className="w-9 h-9 flex items-center justify-center rounded-lg text-base font-bold text-white select-none transition-all"
              style={{
                background: 'rgba(255,255,255,0.08)',
                backdropFilter: 'blur(12px)',
                WebkitBackdropFilter: 'blur(12px)',
                border: '1px solid rgba(255,255,255,0.15)',
                opacity: hovIdx === 0 ? 0.3 : 1,
                cursor: hovIdx === 0 ? 'not-allowed' : 'pointer',
              }}
              title="往前一天"
            >◀</button>

            <div
              className="flex items-center gap-3 px-5 py-2 rounded-xl text-sm select-none"
              style={{
                background: 'rgba(255,255,255,0.07)',
                backdropFilter: 'blur(16px)',
                WebkitBackdropFilter: 'blur(16px)',
                border: '1px solid rgba(255,255,255,0.12)',
                minWidth: '11rem',
                justifyContent: 'center',
              }}
            >
              {hovIdx != null ? (
                <>
                  <span className="text-gray-400 text-xs">📅</span>
                  <span className="text-white font-semibold tracking-wide">{allDates[hovIdx]}</span>
                  <span className="text-gray-500 text-xs">{hovIdx + 1}/{n}</span>
                </>
              ) : (
                <span className="text-gray-500">滑動或點擊圖表</span>
              )}
            </div>

            <button
              onClick={() => setHovIdx(i => Math.min(n - 1, (i ?? n - 1) + 1))}
              disabled={hovIdx === n - 1}
              className="w-9 h-9 flex items-center justify-center rounded-lg text-base font-bold text-white select-none transition-all"
              style={{
                background: 'rgba(255,255,255,0.08)',
                backdropFilter: 'blur(12px)',
                WebkitBackdropFilter: 'blur(12px)',
                border: '1px solid rgba(255,255,255,0.15)',
                opacity: hovIdx === n - 1 ? 0.3 : 1,
                cursor: hovIdx === n - 1 ? 'not-allowed' : 'pointer',
              }}
              title="往後一天"
            >▶</button>
          </div>

        </section>
      );
    };

    const TrafficLight = ({ status }) => {
      const colors = {
        green:  'background-color:#ef4444;box-shadow:0 0 10px rgba(239,68,68,0.8)',
        yellow: 'background-color:#eab308;box-shadow:0 0 10px rgba(234,179,8,0.8)',
        red:    'background-color:#22c55e;box-shadow:0 0 10px rgba(34,197,94,0.8)',
      };
      return (
        <div className="rounded-full w-4 h-4 flex-shrink-0"
          style={{ ...(status === 'green' ? { backgroundColor:'#ef4444', boxShadow:'0 0 10px rgba(239,68,68,0.8)' }
                      : status === 'yellow' ? { backgroundColor:'#eab308', boxShadow:'0 0 10px rgba(234,179,8,0.8)' }
                      : status === 'red'    ? { backgroundColor:'#22c55e', boxShadow:'0 0 10px rgba(34,197,94,0.8)' }
                      : { backgroundColor:'#6b7280' }) }}
        />
      );
    };

    // ==========================================
    // 3. API 抓取邏輯
    // ==========================================
    // 載入快取 JSON + 只抓增量 delta
    const loadWithDelta = async (cacheUrl, fetchDelta) => {
      let cached = [];
      try {
        const res = await fetch(cacheUrl);
        if (res.ok) cached = await res.json();
      } catch(e) {}
      const latest = cached.length
        ? cached.reduce((m, r) => r.date > m ? r.date : m, cached[0].date)
        : null;
      const todayStr = new Date().toISOString().slice(0, 10);
      if (latest && latest >= todayStr) return cached;
      const deltaStart = latest
        ? (() => { const d = new Date(latest); d.setDate(d.getDate() + 1); return d.toISOString().slice(0,10); })()
        : null;
      let delta = [];
      try { delta = await fetchDelta(deltaStart) || []; } catch(e) {}
      if (!delta.length) return cached;
      const existDates = new Set(cached.map(r => r.date));
      return [...cached, ...delta.filter(r => !existDates.has(r.date))]
        .sort((a, b) => a.date.localeCompare(b.date));
    };

    const fetchFinMind = async (dataset, dataId, token, startDate) => {
      let url = `https://api.finmindtrade.com/api/v4/data?dataset=${dataset}&start_date=${startDate}`;
      if (dataId) url += `&data_id=${dataId}`;
      if (token) url += `&token=${token}`;
      const res = await fetch(url);
      const json = await res.json();
      if (json.msg !== 'success' || !json.data || json.data.length === 0)
        throw new Error(json.msg || 'API回傳無數據');
      return json.data;
    };

    const fetchFinMindFallback = async (options, token, startDate) => {
      for (const opt of options) {
        try { return await fetchFinMind(opt.dataset, opt.dataId, token, startDate); }
        catch (e) { console.warn(`[Fallback] ${opt.dataset} failed`); }
      }
      throw new Error('所有備援路由皆查無數據');
    };

    const fetchYahoo = async (symbol) => {
      const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=3mo`;
      const proxies = [
        { url: `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`,
          parse: async r => JSON.parse((await r.json()).contents) },
        { url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
          parse: async r => r.json() },
      ];
      for (const proxy of proxies) {
        try {
          const ctl = new AbortController();
          const timer = setTimeout(() => ctl.abort(), 5000);
          let res;
          try { res = await fetch(proxy.url, { signal: ctl.signal }); }
          finally { clearTimeout(timer); }
          if (!res.ok) continue;
          const json = await proxy.parse(res);
          const result = json?.chart?.result?.[0];
          if (result?.timestamp && result?.indicators?.quote?.[0]?.close) {
            const data = result.timestamp.map((t, i) => ({
              date: new Date(t * 1000).toISOString().split('T')[0],
              close: result.indicators.quote[0].close[i],
            })).filter(d => d.close != null);
            if (data.length > 0) return data;
          }
        } catch (e) { console.warn(`[Yahoo] proxy failed for ${symbol}:`, e); }
      }
      throw new Error('外部資料連線遭拒');
    };

    // ==========================================
    // 4. 下車警示區塊
    // ==========================================
    const ExitSignalBlock = ({ score, moduleData, revData }) => {
      const m0  = moduleData.M1;
      const m5  = moduleData.M6;

      // Signal 1：大盤情緒過熱（由多空評分推算）
      const greedScore = score ?? 0;
      const s1Triggered = greedScore >= 75;
      const s1Status = greedScore >= 75 ? 'red' : greedScore >= 60 ? 'yellow' : 'green';
      const s1Desc = score !== null ? `多空評分 ${score}（${greedScore >= 75 ? '過熱，建議慢慢減碼' : greedScore >= 60 ? '偏熱，留意風險' : '正常範圍'}）` : '等待資料...';

      // Signal 2：月營收警訊（台積電 YoY）
      const s2Triggered = revData && (revData.yoy < 0 || revData.declining);
      const s2Status = !revData ? 'yellow'
        : revData.yoy < 0 ? 'red'
        : revData.declining ? 'yellow'
        : revData.yoy < 5 ? 'yellow' : 'green';
      const s2Desc = !revData ? '月營收資料載入中...'
        : revData.yoy == null ? '月營收資料計算中...'
        : `台積電月營收 YoY ${revData.yoy > 0 ? '+' : ''}${revData.yoy.toFixed(1)}%${revData.declining ? '，連續萎縮中' : ''}`;

      // Signal 3：短線漲幅過高（TAIEX 近 20 日）
      const rally = m5?.rally20d ?? null;
      const s3Triggered = rally != null && rally > 15;
      const s3Status = rally == null ? 'yellow'
        : rally > 20 ? 'red' : rally > 12 ? 'yellow' : 'green';
      const s3Desc = rally != null
        ? `大盤近20日漲幅 ${rally > 0 ? '+' : ''}${rally.toFixed(1)}%（${rally > 20 ? '漲幅過大' : rally > 12 ? '漲幅偏高' : '正常'}）`
        : '技術面資料載入中...';

      // Signal 4：跌破多空分水嶺（M1）
      const s4Triggered = m0?.status === 'red';
      const s4Status = !m0 ? 'yellow' : m0.status === 'red' ? 'red' : 'green';
      const s4Desc = !m0 ? '分水嶺資料載入中...'
        : m0.status === 'red'
          ? `已跌破分水嶺，嚴守紀律停損出場`
          : `持守分水嶺以上，持倉安全`;

      // Signal 5：夜盤重跌 × 公股無護盤（M8 × M9 聯合訊號）
      const m7 = moduleData.M8;
      const m8 = moduleData.M9;
      const s5BothLoaded = m7 && m8;
      const s5Triggered  = s5BothLoaded && m8.status === 'red' && m7.status === 'red';
      const s5Status = !s5BothLoaded ? 'yellow'
        : s5Triggered ? 'red'
        : (m8.status === 'red' && m7.status === 'green') ? 'yellow'
        : 'green';
      const s5Desc = !s5BothLoaded ? 'M8/M9 資料載入中...'
        : s5Triggered ? `夜盤大跌且公股銀行同步看空，明日開盤風險極高`
        : (m8.status === 'red' && m7.status === 'green') ? `夜盤偏空，但公股買超可緩衝跌幅`
        : (m8.status === 'green' && m7.status === 'green') ? `夜盤與公股同步看多，市場信心穩固`
        : `夜盤與公股方向混合，持續觀察`;

      const signals = [
        { num: '①', label: '大盤情緒過熱',   desc: s1Desc, status: s1Status, triggered: s1Triggered, tip: '貪婪指數 > 50 慢慢減碼' },
        { num: '②', label: '月營收警訊',     desc: s2Desc, status: s2Status, triggered: s2Triggered, tip: '同業差/衰退/沒創新高 → 減碼' },
        { num: '③', label: '短線漲幅過高',   desc: s3Desc, status: s3Status, triggered: s3Triggered, tip: '近20日漲幅 > 15% → 先減碼' },
        { num: '④', label: '跌破多空分水嶺',  desc: s4Desc, status: s4Status, triggered: s4Triggered, tip: '跌破分水嶺，嚴守紀律停損' },
        { num: '⑤', label: '夜盤重跌無護盤', desc: s5Desc, status: s5Status, triggered: s5Triggered, tip: 'M9夜盤↓ + M8公股↓ → 雙重利空' },
      ];

      const triggeredCount = signals.filter(s => s.triggered).length;
      const riskColor = triggeredCount >= 4 ? 'text-green-400' : triggeredCount >= 2 ? 'text-orange-400' : triggeredCount === 1 ? 'text-yellow-400' : 'text-red-400';
      const riskLabel = triggeredCount >= 4 ? '高風險，建議減碼' : triggeredCount >= 2 ? '中風險，注意觀察' : triggeredCount === 1 ? '低風險，留意訊號' : '目前無下車訊號';
      const borderColor = triggeredCount >= 4 ? 'border-red-800' : triggeredCount >= 2 ? 'border-orange-800' : triggeredCount === 1 ? 'border-yellow-800' : 'border-gray-700';

      const dotColors = { red: '#22c55e', yellow: '#eab308', green: '#ef4444' };

      return (
        <section className={`mb-6 bg-gray-800 rounded-2xl p-6 border ${borderColor} shadow-xl`}>
          <div className="mb-5">
            <h3 className="text-lg font-bold text-white">⚠️ 下車警示</h3>
            <p className="text-sm text-gray-400 mt-1">
              <span className={`font-bold ${riskColor}`}>{triggeredCount} / {signals.length}</span> 訊號觸發 — <span className={`font-medium ${riskColor}`}>{riskLabel}</span>
            </p>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {signals.map((s, i) => (
              <div key={i} className={`rounded-xl p-4 border transition-all ${s.triggered ? 'bg-green-950/30 border-green-800/60' : 'bg-gray-900/40 border-gray-700'}`}>
                <div className="flex items-start gap-3">
                  <div className="w-3 h-3 rounded-full mt-1 flex-shrink-0" style={{backgroundColor: dotColors[s.status], boxShadow: s.triggered ? `0 0 8px ${dotColors[s.status]}` : 'none'}} />
                  <div className="min-w-0">
                    <p className="text-sm font-bold text-white">
                      {s.num} {s.label}
                      {s.triggered && <span className="ml-2 text-xs bg-green-900 text-green-300 px-1.5 py-0.5 rounded">⚡ 觸發</span>}
                    </p>
                    <p className="text-xs text-gray-300 mt-1">{s.desc}</p>
                    <p className="text-xs text-gray-500 mt-1 italic">{s.tip}</p>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </section>
      );
    };

    // ==========================================
    // 4b. M1 可縮放圖表元件
    // ==========================================
    const M1ZoomChart = ({ taiexData, keyLevel }) => {
      const { useState } = React;
      const STEPS = [30, 60, 90, 120, 180, 250];
      const [stepIdx, setStepIdx] = useState(3); // 預設 120 天
      const days = STEPS[stepIdx];
      const withSMA = calculateSMA(taiexData.map(d => ({ date: d.date, close: d.close })), 60);
      const byDate = Object.fromEntries(withSMA.map(d => [d.date, d.sma60]));
      const chartData = taiexData.slice(-days).map(d => ({ ...d, keyLevel, sma60: byDate[d.date] ?? null }));
      return (
        <div>
          <SvgLineChart
            data={chartData}
            lines={[
              { key:'close',    color:'#ffffff', width:'2'   },
              { key:'keyLevel', color:'#ef4444', width:'1.5' },
              { key:'sma60',    color:'#facc15', width:'1.5' },
            ]}
            height={100}
          />
          <div className="flex items-center justify-end gap-2 mt-2">
            <button
              onClick={() => setStepIdx(i => Math.max(0, i - 1))}
              disabled={stepIdx === 0}
              title="放大（減少天數）"
              className="w-7 h-7 flex items-center justify-center rounded text-sm font-bold text-gray-300 bg-gray-700 hover:bg-gray-600 disabled:opacity-30 disabled:cursor-not-allowed select-none"
            >＋</button>
            <span className="text-xs text-gray-500 w-14 text-center select-none">{days} 天</span>
            <button
              onClick={() => setStepIdx(i => Math.min(STEPS.length - 1, i + 1))}
              disabled={stepIdx === STEPS.length - 1}
              title="縮小（增加天數）"
              className="w-7 h-7 flex items-center justify-center rounded text-sm font-bold text-gray-300 bg-gray-700 hover:bg-gray-600 disabled:opacity-30 disabled:cursor-not-allowed select-none"
            >－</button>
          </div>
        </div>
      );
    };

    // ==========================================
    // 5. ModuleCard
    // ==========================================
    const ModuleCard = ({ id, data, loading, error, isExpanded, onToggle, allModuleData }) => {
      const config = MODULE_CONFIG[id];
      const IconComp = Icons[config.icon];
      const statusText = { green: '多方 / 健康', yellow: '中立 / 注意', red: '空方 / 警示' };

      // M8 ↔ M9 互相關聯提示
      let crossRef = null;
      if (data && !loading && !error) {
        const m7 = allModuleData?.M8;
        const m8 = allModuleData?.M9;
        if (id === 'M9' && m7) {
          if (data.status === 'red' && m7.status === 'green')
            crossRef = { color: 'text-yellow-400', text: '⚡ M8 公股銀行仍在買超，明日或有護盤介入，跌幅可能被壓縮。' };
          else if (data.status === 'red' && m7.status === 'red')
            crossRef = { color: 'text-green-400', text: '🟢 M8 公股銀行同步看空，雙重利空確認，明日開盤風險顯著偏高。' };
          else if (data.status === 'green' && m7.status === 'green')
            crossRef = { color: 'text-red-400', text: '🔴 M8 公股銀行同步看多，籌碼與夜盤情緒共振，多方訊號可信度提升。' };
        }
        if (id === 'M8' && m8) {
          if (m8.status === 'red' && data.status === 'green')
            crossRef = { color: 'text-yellow-400', text: '⚡ M9 夜盤大跌，但公股持續買超，預計明日有護盤行為。' };
          else if (m8.status === 'red' && data.status === 'red')
            crossRef = { color: 'text-green-400', text: '🟢 M9 夜盤同步看空，無公股護盤緩衝，市場壓力倍增。' };
          else if (m8.status === 'green' && data.status === 'green')
            crossRef = { color: 'text-red-400', text: '🔴 M9 夜盤同步看多，期貨情緒與公股籌碼共振，多方信心增強。' };
        }
      }

      return (
        <div className={`bg-gray-800 rounded-xl p-5 border border-gray-700 shadow-lg flex flex-col h-full ${config.wide || (config.wideWhenExpanded && isExpanded) ? 'md:col-span-2 lg:col-span-3' : ''}`}>
          <div className="flex justify-between items-center cursor-pointer" onClick={onToggle}>
            <div className="flex items-center gap-3 w-full pr-4">
              <div className="p-2 bg-gray-700 rounded-lg flex-shrink-0">
                <IconComp size={20} className="text-gray-300" />
              </div>
              <div className="min-w-0">
                <h3 className="text-lg font-bold text-white truncate">{id} {config.title}</h3>
                {loading ? (
                  <span className="text-sm text-gray-400 block mt-1">資料載入中...</span>
                ) : error ? (
                  <span className="text-sm text-red-400 flex items-center gap-1 mt-1 truncate">
                    <Icons.AlertCircle size={14} className="flex-shrink-0" /> 取回失敗
                  </span>
                ) : data ? (
                  <div className="flex items-center gap-2 mt-1">
                    {data.status === 'info'
                      ? <span className="text-sm text-gray-400 font-medium whitespace-nowrap">長期對照 · 不計入評分</span>
                      : <>
                          <TrafficLight status={data.status} />
                          <span className="text-sm text-gray-400 font-medium whitespace-nowrap">{statusText[data.status]}</span>
                        </>}
                  </div>
                ) : null}
              </div>
            </div>
            <button className="text-gray-400 hover:text-white transition-colors flex-shrink-0">
              {isExpanded ? <Icons.ChevronUp size={24} /> : <Icons.ChevronDown size={24} />}
            </button>
          </div>

          {!loading && !error && data && (
            <div className="mt-4 text-gray-300 text-sm leading-relaxed flex-grow">
              {data.summary}
              {crossRef && (
                <p className={`mt-2 text-xs ${crossRef.color} border-t border-gray-700 pt-2`}>{crossRef.text}</p>
              )}
            </div>
          )}
          {error && !loading && (
            <div className="mt-4 text-red-400/80 text-xs bg-red-950/30 p-2 rounded break-words">錯誤: {error}</div>
          )}
          {isExpanded && data && !loading && !error && (
            <div className="mt-5 pt-5 border-t border-gray-700 animate-in">
              <div className="flex items-center justify-between mb-3">
                <p className="text-xs text-gray-500">{data.chartTitle || '近期趨勢'}</p>
                {data.legend && <div className="text-xs flex flex-wrap justify-end gap-x-3 gap-y-1">{data.legend}</div>}
              </div>
              {data.renderChart ? data.renderChart() : <div className="text-gray-500 text-xs">圖表建置中</div>}
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // 5. App
    // ==========================================
    function App() {
      const [token, setToken] = useState(localStorage.getItem('finmind_token') || DEFAULT_FINMIND_TOKEN);
      const [showTokenInput, setShowTokenInput] = useState(false);
      const [lastUpdated, setLastUpdated] = useState('');
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [revData, setRevData] = useState(null);
      const [moduleData, setModuleData] = useState({ M1:null, M2:null, M3:null, M4:null, M5:null, M6:null, M7:null, M8:null, M9:null, M10:null, M11:null, M12:null });
      const [moduleErrors, setModuleErrors] = useState({});
      const [moduleLoading, setModuleLoading] = useState({ M1:true, M2:true, M3:true, M4:true, M5:true, M6:true, M7:true, M8:true, M9:true, M10:true, M11:true, M12:true });
      const [expandedCards, setExpandedCards] = useState({ M1:false, M2:false, M3:false, M4:false, M5:false, M6:false, M7:false, M8:false, M9:false, M10:false, M11:false, M12:true });

      const saveToken = (t) => { setToken(t); localStorage.setItem('finmind_token', t); };

      const fetchAllData = async () => {
        setIsRefreshing(true);
        setModuleErrors({});
        setModuleLoading({ M1:true, M2:true, M3:true, M4:true, M5:true, M6:true, M7:true, M8:true, M9:true, M10:true, M11:true, M12:true });

        const startDate  = getPastDateString(8);
        const recentDate = getPastDateString(3);

        // M0 多空分水嶺（自動偵測關鍵擺盪低點）
        const processM0 = async () => {
          try {
            const raw = await loadWithDelta('./data/taiex.json',
              start => fetchFinMind('TaiwanStockPrice', 'TAIEX', token, start || getPastDateString(5))
                .then(r => r.map(d => ({ date: d.date, close: d.close, open: d.open, high: d.max, low: d.min, volume: d.Trading_Volume }))));
            const taiexData = raw.map(d => ({ date: d.date, close: d.close, open: d.open }));
            if (taiexData.length < 20) throw new Error('TAIEX 資料不足以判斷分水嶺');

            // ── 自動偵測最近擺盪低點 ──────────────────────────────
            // 定義：左右各 3 個交易日內的局部最低收盤，且之後 2 天有往上走
            // 回看範圍：最近 2 個月（約 44 個交易日）
            // 不設反彈 % 門檻 — 轉頭本身即為意義
            const WIN      = 3;
            const SCAN_END = taiexData.length - 2;  // 排除最後 1 日（當日未收盤確認）
            const SCAN_BGN = Math.max(WIN, taiexData.length - 44); // 近 2 個月

            let pivotLow = null;
            for (let i = SCAN_END; i >= SCAN_BGN; i--) {
              const windowPrices = taiexData.slice(i - WIN, i + WIN + 1).map(d => d.close);
              const localMin = Math.min(...windowPrices);
              if (taiexData[i].close > localMin) continue; // 不是局部最低

              // 確認之後有往上走（後 2 日內有收盤 > 低點）
              const afterSlice = taiexData.slice(i + 1, i + 3);
              const afterHigh  = afterSlice.length ? Math.max(...afterSlice.map(d => d.close)) : 0;
              if (afterSlice.length === 0 || afterHigh <= taiexData[i].close) continue;

              pivotLow = taiexData[i];
              break;
            }

            if (!pivotLow) throw new Error('近 2 個月無法偵測到有效擺盪低點');

            const KEY_LOW  = pivotLow.close;
            const KEY_DATE = pivotLow.date;

            const current = taiexData[taiexData.length - 1];
            const diff    = current.close - KEY_LOW;
            const diffPct = (diff / KEY_LOW * 100).toFixed(2);
            const isAbove = current.close > KEY_LOW;
            const status  = isAbove ? 'green' : 'red';

            // 圖表：近 120 日 TAIEX + 分水嶺水平線
            setModuleData(prev => ({...prev, M1: {
              status,
              alignedData: taiexData.slice(-60).map(d => ({ date: d.date, value: d.close })),
              summary: `自動偵測分水嶺：${KEY_DATE} 收盤低點 ${KEY_LOW.toLocaleString()}。當前大盤 ${current.close.toLocaleString()}，${isAbove ? '✅ 站上' : '❌ 跌破'}分水嶺 ${diff > 0 ? '+' : ''}${Math.round(diff)}（${diffPct}%）。`,
              chartTitle: `加權指數 vs 自動分水嶺 ${KEY_LOW.toLocaleString()}（紅線）`,
              legend: (
                <span className="flex items-center gap-1">
                  <span className="w-3 h-0.5 inline-block" style={{backgroundColor:'#ef4444'}}></span>前低
                </span>
              ),
              renderChart: () => (
                <M1ZoomChart taiexData={taiexData} keyLevel={KEY_LOW} />
              ),
            }}));
          } catch(e) { setModuleErrors(prev => ({...prev, M1:e.message})); }
          finally    { setModuleLoading(prev => ({...prev, M1:false})); }
        };

        // M2
        const processM1 = async () => {
          try {
            const [tsmc, delta, mtk, etf50] = await Promise.all([
              fetchFinMind('TaiwanStockPrice', '2330', token, startDate),
              fetchFinMind('TaiwanStockPrice', '2308', token, startDate),
              fetchFinMind('TaiwanStockPrice', '2454', token, startDate),
              fetchFinMind('TaiwanStockPrice', '0050', token, startDate),
            ]);
            const tsmcData  = calculateSMA(tsmc.map(d => ({ date:d.date, close:d.close })), 60);
            const deltaData = calculateSMA(delta.map(d => ({ date:d.date, close:d.close })), 60);
            const mtkData   = calculateSMA(mtk.map(d => ({ date:d.date, close:d.close })), 60);
            const etf50Data = calculateSMA(etf50.map(d => ({ date:d.date, close:d.close })), 60);

            const lastT  = tsmcData[tsmcData.length-1];
            const lastD  = deltaData[deltaData.length-1];
            const lastM  = mtkData[mtkData.length-1];
            const lastE  = etf50Data[etf50Data.length-1];
            const tsmcAbove  = lastT.close > lastT.sma60;
            const deltaAbove = lastD.close > lastD.sma60;
            const mtkAbove   = lastM.close > lastM.sma60;
            const etf50Above = lastE.close > lastE.sma60;
            const aboveCount = [tsmcAbove, deltaAbove, mtkAbove, etf50Above].filter(Boolean).length;

            let status = 'green';
            if (aboveCount <= 2) status = 'yellow';
            if (aboveCount <= 1 || !tsmcAbove) status = 'red';

            setModuleData(prev => ({...prev, M2: {
              status,
              alignedData: tsmcData.slice(-60).map(d => ({ date: d.date, value: d.close })),
              summary: `台積電(2330)${tsmcAbove?'站上':'跌破'}季線，0050${etf50Above?'站上':'跌破'}季線。共 ${aboveCount}/4 檔位於季線之上。`,
              chartTitle: '權值股走勢（近 120 日）',
              legend: (
                <span className="flex items-center gap-1">
                  <span className="w-2 h-2 rounded-full inline-block" style={{backgroundColor:'#facc15'}}></span>60MA
                </span>
              ),
              renderChart: () => (
                <div className="flex flex-col gap-4">
                  {[
                    ['2330 台積電', tsmcData,  '#60a5fa'],
                    ['2308 台達電', deltaData, '#4ade80'],
                    ['2454 聯發科', mtkData,   '#c084fc'],
                    ['0050 元大台灣50', etf50Data, '#fb923c'],
                  ].map(([label, d, color]) => (
                    <div key={label}>
                      <p className="text-xs font-medium mb-1" style={{color}}>{label}</p>
                      <SvgLineChart data={d.slice(-120)} lines={[{key:'close',color,width:'2'},{key:'sma60',color:'#facc15',width:'1.5'}]} height={80} />
                    </div>
                  ))}
                </div>
              ),
            }}));
          } catch(e) { setModuleErrors(prev => ({...prev, M2:e.message})); }
          finally    { setModuleLoading(prev => ({...prev, M2:false})); }
        };

        // M3
        const processM2 = async () => {
          try {
            const data = await loadWithDelta('./data/institutional.json',
              start => fetchFinMindFallback([
                { dataset:'TaiwanStockTotalInstitutionalInvestors', dataId:'' },
                { dataset:'TaiwanStockInstitutionalInvestors', dataId:'TAIEX' },
              ], token, start || recentDate)
                .then(r => r.map(d => ({ date: d.date, name: d.name, buy: d.buy, sell: d.sell }))));

            const foreignData = data.filter(d => d.name && (d.name.includes('外資') || d.name.includes('Foreign_Investor')));
            const byDate = {};
            foreignData.forEach(d => {
              if (!byDate[d.date]) byDate[d.date] = 0;
              byDate[d.date] += ((Number(d.buy)||0) - (Number(d.sell)||0)) / 1e8;
            });
            const sortedDates = Object.keys(byDate).sort();
            if (!sortedDates.length) throw new Error('找不到外資買賣超資料');

            const chartData = sortedDates.slice(-60).map(date => ({ date, netBuy: byDate[date] }));
            const n = Math.min(5, chartData.length);
            const last5Total = chartData.slice(-n).reduce((s, d) => s + d.netBuy, 0);

            let status = 'yellow';
            if (last5Total > 100) status = 'green';
            if (last5Total < -100) status = 'red';

            setModuleData(prev => ({...prev, M3: {
              status,
              alignedData: sortedDates.slice(-60).map(date => ({ date, value: byDate[date] })),
              summary: `大盤籌碼統計：外資近 ${n} 個交易日合計買賣超為 ${last5Total > 0 ? '+' : ''}${Math.round(last5Total)} 億元。`,
              chartTitle: '外資大盤買賣超（近 60 日，億元）',
              renderChart: () => <SvgBarChart data={chartData} dataKey="netBuy" colorFn={d => d.netBuy > 0 ? '#ef4444' : '#22c55e'} />,
            }}));
          } catch(e) { setModuleErrors(prev => ({...prev, M3:e.message})); }
          finally    { setModuleLoading(prev => ({...prev, M3:false})); }
        };

        // M3 籌碼乾淨度
        const processM3 = async () => {
          try {
            const data = await fetchFinMindFallback([
              { dataset:'TaiwanStockTotalMarginPurchaseShortSale', dataId:'' },
              { dataset:'TaiwanStockMarginPurchaseShortSale', dataId:'TAIEX' },
              { dataset:'TaiwanStockMarginPurchaseShortsale', dataId:'TAIEX' },
            ], token, recentDate);

            // 每日有三種 row，依 name 欄位區分
            // name: "MarginPurchase" → 融資餘額（張）
            // name: "ShortSale"      → 融券餘額（張）
            const byDate = {};
            data.forEach(d => {
              if (!byDate[d.date]) byDate[d.date] = { margin: 0, short: 0 };
              if (d.name === 'MarginPurchase') byDate[d.date].margin = Number(d.TodayBalance) || 0;
              if (d.name === 'ShortSale')      byDate[d.date].short  = Number(d.TodayBalance) || 0;
            });

            const sortedDates = Object.keys(byDate).sort().filter(d => byDate[d].margin > 0);
            if (sortedDates.length < 5) throw new Error('可用籌碼數據不足');

            const series = sortedDates.slice(-60).map(date => ({
              date,
              margin: byDate[date].margin,
              short:  byDate[date].short,
              ratio:  byDate[date].margin > 0 ? (byDate[date].short / byDate[date].margin) * 100 : 0,
            }));

            const cur  = series[series.length - 1];
            const prev5 = series[series.length - Math.min(6, series.length)];

            // ── 指標 1：融資水位（近30日百分位）────────────────
            const marginVals = series.map(d => d.margin);
            const marginMin  = Math.min(...marginVals);
            const marginMax  = Math.max(...marginVals);
            const marginPct  = marginMax > marginMin
              ? ((cur.margin - marginMin) / (marginMax - marginMin)) * 100 : 50;

            // ── 指標 2：融資趨勢（近6日變化率）──────────────────
            const marginTrend = prev5.margin ? ((cur.margin - prev5.margin) / prev5.margin) * 100 : 0;

            // ── 指標 3：融券/融資比（近30日百分位）──────────────
            const ratioVals = series.filter(d => d.ratio > 0).map(d => d.ratio);
            const ratioMin  = ratioVals.length ? Math.min(...ratioVals) : 0;
            const ratioMax  = ratioVals.length ? Math.max(...ratioVals) : 1;
            const ratioPct  = (ratioMax > ratioMin && cur.ratio > 0)
              ? ((cur.ratio - ratioMin) / (ratioMax - ratioMin)) * 100 : 50;

            // ── 綜合判斷：乾淨度評分（0~100，越高越乾淨）────────
            // 融資低位 → 加分；融資縮減 → 加分；融券/融資比高 → 加分
            const cleanScore =
              (100 - marginPct) * 0.45 +   // 融資低位佔 45%
              (marginTrend < 0 ? 100 : marginTrend < 3 ? 60 : 20) * 0.30 + // 趨勢佔 30%
              ratioPct * 0.25;              // 融券比佔 25%

            let status = 'yellow';
            let cleanLabel = '中性';
            if (cleanScore >= 65) { status = 'green'; cleanLabel = '乾淨'; }
            if (cleanScore < 40)  { status = 'red';   cleanLabel = '混濁'; }

            const fmt = v => v > 0 ? `+${v.toFixed(1)}` : v.toFixed(1);

            setModuleData(prev => ({...prev, M4: {
              status,
              alignedData: series.map(d => ({ date: d.date, value: Math.round(d.margin / 100000) })),
              summary: `籌碼${cleanLabel}（乾淨度 ${Math.round(cleanScore)}/100）。融資水位處近期 ${Math.round(marginPct)}% 分位，近6日${marginTrend < 0 ? '縮減' : '增加'} ${fmt(marginTrend)}%；融券/融資比 ${cur.ratio.toFixed(2)}%，處近期 ${Math.round(ratioPct)}% 分位。`,
              chartTitle: '融資餘額（紫）與融券/融資比（橙）（近 60 日）',
              legend: (
                <div className="flex gap-3">
                  <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full inline-block" style={{backgroundColor:'#c084fc'}}></span>融資</span>
                  <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full inline-block" style={{backgroundColor:'#fb923c'}}></span>融券/融資比</span>
                </div>
              ),
              renderChart: () => (
                <div className="flex flex-col gap-3">
                  <SvgLineChart data={series} lines={[{key:'margin', color:'#c084fc', width:'2'}]} height={70} />
                  <SvgLineChart data={series} lines={[{key:'ratio',  color:'#fb923c', width:'2'}]} height={50} />
                </div>
              ),
            }}));
          } catch(e) { setModuleErrors(prev => ({...prev, M4:e.message})); }
          finally    { setModuleLoading(prev => ({...prev, M4:false})); }
        };

        // M4 + M6
        const processM4M5 = async () => {
          try {
            const raw = await loadWithDelta('./data/taiex.json',
              start => fetchFinMind('TaiwanStockPrice', 'TAIEX', token, start || startDate)
                .then(r => r.map(d => ({ date: d.date, close: d.close, open: d.open, high: d.max, low: d.min, volume: d.Trading_Volume }))));
            const fmt = raw.map(d => ({ date:d.date, close:d.close, volume:(d.volume||d.Trading_Volume||0)/1e8, open:d.open }));
            let td = calculateSMA(fmt, 60);
            td = calculateSMA(td, 120);
            td = calculateMACD(td);

            // 成交量：略過 volume=0（盤中/尚未回填/歷史缺漏）的列；十日均量只用 volume>0 的交易日
            const vd = calculateSMA(td.filter(d => d.volume > 0), 10, 'volume');
