            const smaByDate = new Map(vd.map(d => [d.date, d.sma10]));
            const volTd = td.map(d => ({ ...d, volume: d.volume > 0 ? d.volume : null, sma10: smaByDate.get(d.date) ?? null }));

            const last = td[td.length-1];   // M6 仍以最新一列（收盤價）計算
            const lastVol = vd[vd.length-1];
            const lastVolIdx = td.findIndex(d => d.date === lastVol.date);
            const prevVol = td[lastVolIdx-1] || td[lastVolIdx];
            const volRatio = lastVol.volume / lastVol.sma10;
            const priceUp  = lastVol.close > prevVol.close;

            let m4Status = 'yellow';
            if (volRatio > 1.2 && priceUp)  m4Status = 'green';
            if (volRatio > 1.2 && !priceUp) m4Status = 'red';

            setModuleData(p => ({...p, M5: {
              status: m4Status,
              alignedData: volTd.slice(-60).map(d => ({ date: d.date, value: d.volume })),
              summary: `大盤最近有量交易日（${lastVol.date}${lastVol.date !== last.date ? '，最新一日成交量尚未回填' : ''}）成交量約 ${Math.round(lastVol.volume)} 億，為十日均量的 ${(volRatio*100).toFixed(0)}%。呈現量${volRatio>1?'增':'縮'}價${priceUp?'漲':'跌'}。`,
              chartTitle: '加權指數成交量（近 60 日，億）',
              renderChart: () => <SvgBarChart data={volTd.slice(-60)} dataKey="volume" colorFn={d => d.close > d.open ? '#ef4444' : '#22c55e'} />,
            }}));

            const over60  = last.close > last.sma60;
            const over120 = last.close > last.sma120;
            let m5Status = 'green';
            if (over60 && !over120) m5Status = 'yellow';
            if (!over60 && last.macd < 0) m5Status = 'red';

            // 近 20 交易日漲幅（供下車警示 Signal 3 使用）
            const prev20 = td.length >= 21 ? td[td.length - 21].close : null;
            const rally20d = prev20 ? ((last.close - prev20) / prev20) * 100 : null;

            setModuleData(p => ({...p, M6: {

              alignedData: td.slice(-60).map(d => ({ date: d.date, value: d.macd ?? null })),
              summary: `加權指數${over60?'站上':'跌破'}季線，${over120?'站上':'跌破'}半年線。MACD 值為 ${last.macd.toFixed(1)}。`,
              chartTitle: '加權指數走勢與季線（黃）/半年線（紫）（近 120 日）',
              renderChart: () => (

          finally    { setModuleLoading(prev => ({...prev, M5:false, M6:false})); }

        // M7
        const processM6 = async () => {
          try {

            if (!soxData) for (const item of [{code:'^SOX',name:'費城半導體指數 (^SOX)'},{code:'SOXX',name:'費半 ETF (SOXX)'},{code:'TSM',name:'台積電 ADR (TSM)'}]) {

            setModuleData(prev => ({...prev, M7: {

              alignedData: (() => {
                const s = soxData.slice(-61);
                const nextTD = str => { const d = new Date(str); d.setDate(d.getDate() + (d.getDay()===5?3:d.getDay()===6?2:1)); return d.toISOString().slice(0,10); };
                return s.slice(0,-1).map((d,i) => ({ date: s[i+1].date, value: d.close }))
                  .concat([{ date: nextTD(s[s.length-1].date), value: s[s.length-1].close }]);
              })(),
              summary: `${displayName} 近 5 日漲跌幅為 ${rate > 0 ? '+' : ''}${rate.toFixed(2)}%。`,
              chartTitle: `${displayName} 走勢（近 60 日）`,
              renderChart: () => <SvgLineChart data={soxData} lines={[{key:'close',color:'#38bdf8',width:'2'}]} />,
            }}));
          } catch(e) { setModuleErrors(prev => ({...prev, M7:e.message})); }
          finally    { setModuleLoading(prev => ({...prev, M7:false})); }
        };

        // M8 公股銀行動向
        const processM7 = async () => {
          try {
            const BANKS = {
              tcb: '合庫', bot: '台銀', land: '土銀', hncb: '華南',
              mega: '兆豐', tbb: '台企銀', chb: '彰銀', first: '第一金',
            };

            // 嘗試三個資料來源：histock localStorage > wantgoo localStorage > public-bank.json
            let series = null;

            // 來源 1：histock localStorage（{date, amount} 億元）
            const histockCached = localStorage.getItem('histock-bank-data');
            if (histockCached) {
              const parsed = JSON.parse(histockCached);
              series = parsed
                .filter(d => d.date && d.amount != null)
                .map(d => ({ date: d.date.slice(0, 10), total: d.amount })) // 億元
                .sort((a, b) => a.date.localeCompare(b.date));
              console.log('[M8] Using histock localStorage, records:', series.length);
            }

            // 來源 2：wantgoo localStorage（per-bank 萬元）
            if (!series) {
              const wantgooCached = localStorage.getItem('wantgoo-bank-data');
              if (wantgooCached) {
                const raw = JSON.parse(wantgooCached);
                series = raw.map(d => {
                  const total = d.total !== undefined
                    ? d.total / 10000
                    : Object.keys(BANKS).reduce((s, k) => s + (d[k]?.amount || 0), 0) / 10000;
                  return { date: d.date.slice(0, 10), total };
                }).sort((a, b) => a.date.localeCompare(b.date));

            // 來源 3：public-bank.json（wantgoo 格式，萬元）
            if (!series) {
              try {

                if (res.ok) {
                  const raw = await res.json();
                  series = raw.map(d => {
                    const total = d.total !== undefined
                      ? d.total / 10000
                      : Object.keys(BANKS).reduce((s, k) => s + (d[k]?.amount || 0), 0) / 10000;
                    return { date: d.date.slice(0, 10), total };
                  }).sort((a, b) => a.date.localeCompare(b.date));
                }
              } catch(e) {}
            }

            if (!series || series.length === 0)
              throw new Error('公股銀行資料尚未建立。請前往 update-bank.html 依指示更新一次。');

            const recent5 = series.slice(-5);
            const sum5 = recent5.reduce((s, d) => s + d.total, 0);

            let consecutiveBuy = 0;
            for (let i = series.length - 1; i >= 0; i--) {
              if (series[i].total > 0) consecutiveBuy++;
              else break;
            }

            const latest = series[series.length - 1];
            let status = 'yellow';
            if (sum5 > 0 && latest.total > 0) status = 'green';
            if (sum5 < 0) status = 'red';

            const fmt = v => `${v > 0 ? '+' : ''}${v.toFixed(1)}億`;

            setModuleData(prev => ({...prev, M8: {
              status,
              alignedData: series.slice(-60).map(d => ({ date: d.date, value: d.total })),
              summary: `八大公股銀行近5日合計 ${fmt(sum5)}（億元）。最新一日 ${fmt(latest.total)}，連續${consecutiveBuy > 0 ? `買超 ${consecutiveBuy} 日` : '賣超'}。${status === 'green' ? '護盤力道介入中。' : status === 'red' ? '公股銀行撤出，無護盤訊號。' : '買賣方向混合。'}`,
              chartTitle: '八大公股銀行買賣超合計（近 60 日，億元）',
              renderChart: () => (
                <SvgBarChart
                  data={series.slice(-60)}

                  height={100}
                />

          } catch(e) { setModuleErrors(prev => ({...prev, M8:e.message})); }
          finally    { setModuleLoading(prev => ({...prev, M8:false})); }
        };

        // M11 MACD(9/12/130) + KD(9,3,3) 短線時機
        const processM11 = async () => {
          try {
            const raw = await loadWithDelta('./data/taiex.json',
              start => fetchFinMind('TaiwanStockPrice', 'TAIEX', token, start || getPastDateString(5))
                .then(r => r.map(d => ({ date: d.date, close: d.close, open: d.open, high: d.max, low: d.min, volume: d.Trading_Volume }))));
            const base = raw.map(d => ({ date: d.date, close: d.close, high: d.high ?? d.close, low: d.low ?? d.close }));
            if (base.length < 150) throw new Error('加權指數資料不足 150 日（慢線 130 日需暖機）。');

            // 兩種買賣策略（皆以收盤價進出；持有時不重複買、空手時不賣）：
            //  conv  新：綠柱（負）連續收斂第 3 根買進；持有時紅柱（正）連續收斂第 3 根賣出（收斂＝同色柱比前一根短，中途變長重新計數）
            //  cross 舊：柱體由負轉正買進；由正轉負賣出
            const CONV_BARS = 3;
            let negRun = 0, posRun = 0, holdC = false, holdX = false;
            const td = calculateKD(calculateMACDCustom(base, 9, 12, 130)).map((d, i, a) => {
              const ph = i > 0 ? a[i - 1].hist : d.hist;
              negRun = (d.hist < 0 && ph < 0 && Math.abs(d.hist) < Math.abs(ph)) ? negRun + 1 : 0;
              posRun = (d.hist > 0 && ph > 0 && Math.abs(d.hist) < Math.abs(ph)) ? posRun + 1 : 0;
              let sigConv = null, sigCross = null;
              if (!holdC && negRun === CONV_BARS) { sigConv = 'buy'; holdC = true; }
              else if (holdC && posRun === CONV_BARS) { sigConv = 'sell'; holdC = false; }
              if (!holdX && ph <= 0 && d.hist > 0) { sigCross = 'buy'; holdX = true; }
              else if (holdX && ph >= 0 && d.hist < 0) { sigCross = 'sell'; holdX = false; }
              return { ...d, sigConv, sigCross };
            });
            const n = td.length;
            const last = td[n - 1], prev = td[n - 2];

            const histPos   = last.hist > 0;
            const expanding = Math.abs(last.hist) > Math.abs(prev.hist);
            const kAbove    = last.k > last.d;

            // 教學四象限（正增強+黃金 / 正減弱+死亡 / 負增強+死亡 / 負減弱+黃金）；其餘四種歸中立
            const CASES = {
              PEG: { status: 'green',  text: '短線轉強：柱體正向增強且 K 在 D 上方' },
              PSD: { status: 'yellow', text: '動能降溫：柱體正向減弱且 K 在 D 下方' },
              NED: { status: 'red',    text: '下跌風險：柱體負向增強且 K 在 D 下方，留意柱體是否變更長' },
              NSG: { status: 'yellow', text: '止跌觀察：柱體負向減弱且 K 在 D 上方，觀察是否逐步止跌' },
              PED: { status: 'yellow', text: '多頭中的短線回檔：柱體正向增強但 K 在 D 下方' },
              PSG: { status: 'yellow', text: '多方動能轉弱：柱體正向減弱，K 仍在 D 上方' },
              NEG: { status: 'yellow', text: '空頭中的反彈：柱體負向增強，但 K 在 D 上方' },
              NSD: { status: 'yellow', text: '空方動能減弱：柱體負向減弱，K 仍在 D 下方' },
            };
            const c = CASES[`${histPos ? 'P' : 'N'}${expanding ? 'E' : 'S'}${kAbove ? 'G' : 'D'}`];

            const zone = last.k < 20 ? 'K 值位於超賣區（<20），留意指標鈍化。'
                       : last.k > 80 ? 'K 值位於超買區（>80），留意指標鈍化。' : '';
            const crossToday = (prev.k <= prev.d && last.k > last.d) ? '今日剛出現 KD 黃金交叉。'
                             : (prev.k >= prev.d && last.k < last.d) ? '今日剛出現 KD 死亡交叉。' : '';

            const lastSig = key => {
              let idx = -1;
              for (let i = n - 1; i >= 0; i--) { if (td[i][key]) { idx = i; break; } }
              return idx >= 0
                ? `最近訊號：${td[idx][key] === 'buy' ? '▲買進' : '▼賣出'} ${td[idx].date}（${n - 1 - idx} 個交易日前）。` : '';
            };
            const sigInfo = {
              conv: lastSig('sigConv') + (holdC
                ? (posRun > 0 && posRun < CONV_BARS ? `持有中，紅柱已收斂 ${posRun}/${CONV_BARS} 根。` : '持有中。')
                : (negRun > 0 && negRun < CONV_BARS ? `空手，綠柱已收斂 ${negRun}/${CONV_BARS} 根。` : '空手。')),
              cross: lastSig('sigCross') + (holdX ? '持有中。' : '空手。'),
            };

            setModuleData(prev => ({...prev, M11: {
              status: c.status,
              alignedData: td.slice(-60).map(d => ({ date: d.date, value: d.hist })),
              summary: <M11Summary info={sigInfo} base={`MACD(9/12/130) 柱體 ${last.hist > 0 ? '+' : ''}${last.hist.toFixed(0)}（${histPos ? '正' : '負'}向${expanding ? '增強' : '減弱'}），K ${last.k.toFixed(1)} / D ${last.d.toFixed(1)}（K 在 D ${kAbove ? '上方' : '下方'}）。${c.text}。${zone}${crossToday}`} />,
              chartTitle: '▲買進 ▼賣出（依所選策略）· 連線＝一個波段',
              legend: (<>
                <span className="text-red-400 whitespace-nowrap">▲買進</span>
                <span className="text-green-400 whitespace-nowrap">▼賣出</span>
                <span className="text-red-400 whitespace-nowrap">┄獲利</span>
                <span className="text-green-400 whitespace-nowrap">┄虧損</span>
                <span className="text-yellow-400 whitespace-nowrap">K</span>
                <span className="text-sky-400 whitespace-nowrap">D</span>
              </>),
              renderChart: () => <M11Panel td={td} />,
            }}));
          } catch(e) { setModuleErrors(prev => ({...prev, M11:e.message})); }
          finally    { setModuleLoading(prev => ({...prev, M11:false})); }
        };

        // M12 外資持股比重 vs 加權指數（長期對照；不計入評分）
        const processM12 = async () => {
          try {
            const [fh, tx] = await Promise.all([
              fetch('./data/foreign-holding.json').then(r => { if (!r.ok) throw new Error('外資持股資料尚未建立。'); return r.json(); }),
              fetch('./data/taiex.json').then(r => r.ok ? r.json() : []).catch(() => []),
            ]);
            const px = Object.fromEntries(tx.map(d => [d.date, d.close]));
            const rows = fh.sort((a, b) => a.date.localeCompare(b.date)).map(d => ({ ...d, index: d.idx ?? px[d.date] ?? null }));
            if (rows.length < 21) throw new Error('外資持股資料不足 21 日。');

            const n = rows.length, last = rows[n - 1];
            const ratios = rows.map(d => d.ratio);
            const rMin = Math.min(...ratios), rMax = Math.max(...ratios);
            const pos = rMax > rMin ? Math.round((last.ratio - rMin) / (rMax - rMin) * 100) : 50;
            const sg = v => `${v > 0 ? '+' : ''}${v.toFixed(2)}`;

            const horizons = [['1 年', 1], ['3 年', 3], ['5 年', 5], ['10 年', 10], ['15 年', 15]]
              .map(([label, y]) => {
                const dt = new Date(last.date);
                dt.setFullYear(dt.getFullYear() - y);
                const cut = dt.toISOString().slice(0, 10);
                let o = null;
                for (let i = n - 1; i >= 0; i--) { if (rows[i].date <= cut) { o = rows[i]; break; } }
                if (!o) return null;
                const idx = (last.index != null && o.index != null)
                  ? `（指數 ${sg((last.index / o.index - 1) * 100)}%）` : '';
                return `${label}前 ${sg(last.ratio - o.ratio)}pp${idx}`;
              })
              .filter(Boolean);

            setModuleData(prev => ({...prev, M12: {
              status: 'info',
              alignedData: rows.slice(-60).map(d => ({ date: d.date, value: d.exTsmc })),
              summary: `外資持股占上市總市值 ${last.ratio.toFixed(2)}%（不含台積電 ${last.exTsmc.toFixed(2)}%）。資料自 ${rows[0].date} 起（${n} 筆）的區間為 ${rMin.toFixed(2)}%~${rMax.toFixed(2)}%，目前位於 ${pos}% 位置。${horizons.length ? '持股比重較 ' + horizons.join('、') + '。' : ''}`,
              chartTitle: '持股比重 vs 加權指數（1／3／5／10／15 年，兩軸各自自動縮放）',
              legend: (<>
                <span className="text-blue-400 whitespace-nowrap">— 左軸：持股比重</span>
                <span className="text-red-400 whitespace-nowrap">- - 右軸：加權指數</span>
              </>),
              renderChart: () => <ForeignLongChart rows={rows} />,
            }}));
          } catch(e) { setModuleErrors(prev => ({...prev, M12:e.message})); }
          finally    { setModuleLoading(prev => ({...prev, M12:false})); }
        };

        // M10 外資持股比重（外資持股市值 ÷ 上市總市值，TWSE 每日盤後公布）
        const processM10 = async () => {
          try {
            const res = await fetch('./data/foreign-holding.json');
            if (!res.ok) throw new Error('外資持股資料尚未建立。');
            const series = (await res.json()).sort((a, b) => a.date.localeCompare(b.date)).slice(-250);
            if (series.length < 21) throw new Error('外資持股資料不足 21 日。');

            const n = series.length;
            const latest = series[n - 1];
            const d5  = latest.ratio - series[n - 6].ratio;
            const d20 = latest.ratio - series[n - 21].ratio;
            const d60 = n > 60 ? latest.ratio - series[n - 61].ratio : null;
            const x20 = latest.exTsmc - series[n - 21].exTsmc;

            const ratios = series.map(d => d.ratio);
            const rMin = Math.min(...ratios), rMax = Math.max(...ratios);
            const pos = rMax > rMin ? Math.round((latest.ratio - rMin) / (rMax - rMin) * 100) : 50;

            let status = 'yellow';
            if (d20 > 0 && d5 > 0) status = 'green';
            if (d20 <= -1) status = 'red';

            const sg = v => `${v > 0 ? '+' : ''}${v.toFixed(2)}`;

            setModuleData(prev => ({...prev, M10: {
              status,
              alignedData: series.slice(-60).map(d => ({ date: d.date, value: d.ratio })),
              summary: `外資持股占上市總市值 ${latest.ratio.toFixed(2)}%（不含台積電 ${latest.exTsmc.toFixed(2)}%）。近 20 日 ${sg(d20)}pp、近 5 日 ${sg(d5)}pp${d60 != null ? `、近 60 日 ${sg(d60)}pp` : ''}，位於近 ${n} 日區間的 ${pos}% 位置。持股 ≥50% 的個股 ${latest.over50} 檔。${status === 'green' ? '外資持股比重回升，籌碼面偏多。' : status === 'red' ? '外資持股比重明顯下降（近 20 日降逾 1pp），若指數同步在高檔屬背離，需提高警覺。' : '外資持股比重變動不大，方向未明。'}`,
              chartTitle: `評分指標（近 ${n} 日）· 完整走勢與加權指數對照見 M12`,
              renderChart: () => {
                const rc = v => (v > 0 ? 'text-red-400' : v < 0 ? 'text-green-400' : 'text-gray-400');
                const tile = (label, value, sub) => (
                  <div key={label} className="bg-gray-900/60 border border-gray-700 rounded-lg px-3 py-2">
                    <p className="text-[11px] text-gray-500">{label}</p>
                    <p className="text-base font-bold text-white leading-snug">{value}</p>
                    <p className="text-[11px] text-gray-400">{sub}</p>
                  </div>
                );
                const dv = (v) => v == null ? '—' : <span className={rc(v)}>{sg(v)}pp</span>;
                return (
                  <div className="grid grid-cols-2 gap-2">
                    {tile('持股比重', `${latest.ratio.toFixed(2)}%`, `不含台積電 ${latest.exTsmc.toFixed(2)}%`)}
                    {tile('區間位置', `${pos}%`, `近 ${n} 日 ${rMin.toFixed(2)}–${rMax.toFixed(2)}%`)}
                    {tile('近 5／20 日', <span className="text-sm">{dv(d5)}{' / '}{dv(d20)}</span>, '燈號依據')}
                    {tile('近 60 日', dv(d60), `持股≥50% 個股 ${latest.over50} 檔`)}
                  </div>
                );
              },
            }}));
          } catch(e) { setModuleErrors(prev => ({...prev, M10:e.message})); }
          finally    { setModuleLoading(prev => ({...prev, M10:false})); }
        };

        // 台積電月營收（下車警示 Signal 2）
        const processRevenue = async () => {
          try {
            const data = await fetchFinMind('TaiwanStockMonthRevenue', '2330', token, getPastDateString(18));
            const sorted = data.sort((a, b) => a.date.localeCompare(b.date));
            if (sorted.length < 13) return;
            const latest   = sorted[sorted.length - 1];
            const yearAgo  = sorted[sorted.length - 13];
            const prev     = sorted[sorted.length - 2];
            const yoy = yearAgo ? ((latest.revenue - yearAgo.revenue) / yearAgo.revenue) * 100 : null;
            const mom = prev    ? ((latest.revenue - prev.revenue)    / prev.revenue)    * 100 : null;
            // 近 3 個月是否在衰退 (連續兩次 MoM 負成長)
            const m2  = sorted[sorted.length - 3];
            const mom2 = m2 && prev ? ((prev.revenue - m2.revenue) / m2.revenue) * 100 : null;
            const declining = mom !== null && mom < 0 && mom2 !== null && mom2 < 0;
            setRevData({ yoy, mom, declining, date: latest.date, revenue: latest.revenue });
          } catch(e) { console.warn('[Revenue]', e.message); }
        };

        // M9 夜盤動向（台指期 after_market session）
        const processM8 = async () => {
          try {
            const raw = await loadWithDelta('./data/futures.json',
              start => fetchFinMind('TaiwanFuturesDaily', 'TX', token, start || getPastDateString(10))
                .then(r => r.map(d => ({
                  date: d.date, trading_session: d.trading_session,
                  contract_date: d.contract_date, close: d.close, spread_per: d.spread_per,
                }))));
            if (!raw || raw.length === 0) throw new Error('台指期資料不足');

            // 取近月合約：找有實際夜盤資料（close>0）的最近 YYYYMM 合約
            const today = new Date().toISOString().slice(0,7).replace('-','');
            const validAfter = raw.filter(d => d.trading_session === 'after_market' && d.close > 0 && /^\d{6}$/.test(d.contract_date));
            const latestAfterDate = validAfter.reduce((m, d) => d.date > m ? d.date : m, '');
            const recentContracts = [...new Set(validAfter.filter(d => d.date === latestAfterDate).map(d => d.contract_date))].sort();
            const nearContract = recentContracts[0] || today;

            // 夜盤 & 日盤資料（近月）
            const afterMkt = raw.filter(d => d.trading_session === 'after_market' && d.contract_date === nearContract)
              .sort((a,b) => a.date.localeCompare(b.date));
            const dayMkt   = raw.filter(d => d.trading_session !== 'after_market' && d.contract_date === nearContract)
              .sort((a,b) => a.date.localeCompare(b.date));

            if (afterMkt.length < 3) throw new Error('夜盤資料筆數不足');

            // 近5日夜盤漲跌幅
            const recent5 = afterMkt.slice(-5);
            const bullDays = recent5.filter(d => d.spread_per > 0).length;
            const bearDays = recent5.filter(d => d.spread_per < 0).length;

            const latest = afterMkt[afterMkt.length - 1];
            const latestDay = dayMkt[dayMkt.length - 1];

            // 期現貨差（basis）：夜盤最新收盤 vs 日盤最新收盤
            const basis = latestDay ? latest.close - latestDay.close : null;
            const basisPct = latestDay ? ((basis / latestDay.close) * 100).toFixed(2) : null;

            // 狀態判斷
            // 單日暴跌 ≥ 2% 或連續空方 ≥ 2 天且最新也是空 → 紅燈
            // 單日暴漲 ≥ 2% 或連續多方 ≥ 3 天且最新也是多 → 綠燈
            let status = 'yellow';
            if (latest.spread_per >= 2 || (bullDays >= 3 && latest.spread_per > 0)) status = 'green';
            if (latest.spread_per <= -2 || (bearDays >= 2 && latest.spread_per < 0)) status = 'red';

            // 圖表資料：近60日夜盤漲跌幅
            const chartData = afterMkt.slice(-60).map(d => ({ date: d.date, value: parseFloat(d.spread_per.toFixed(2)) }));

            const dirStr = latest.spread_per > 0 ? `上漲 +${latest.spread_per.toFixed(2)}%` : `下跌 ${latest.spread_per.toFixed(2)}%`;
            const basisStr = basis !== null ? `，期現差 ${basis > 0 ? '+' : ''}${Math.round(basis)} 點 (${basisPct}%)` : '';

            setModuleData(prev => ({...prev, M9: {
              status,
              alignedData: afterMkt.slice(-60).map(d => ({ date: d.date, value: parseFloat(d.spread_per.toFixed(2)) })),
              summary: `台指期夜盤最新（${latest.date}）${dirStr}，收 ${latest.close} 點${basisStr}。近5日多${bullDays}空${bearDays}。${status === 'green' ? (latest.spread_per >= 2 ? `單日大漲 ${latest.spread_per.toFixed(1)}%，夜盤強勢看多。` : '夜盤偏多，市場情緒樂觀。') : status === 'red' ? (latest.spread_per <= -2 ? `單日大跌 ${latest.spread_per.toFixed(1)}%，夜盤顯著看空，明日開盤留意風險。` : '夜盤連續偏空，市場情緒謹慎。') : '夜盤方向混合，觀望為宜。'}`,
              chartTitle: '台指期夜盤漲跌幅（近 60 日，%）',
              renderChart: () => (
                <SvgBarChart
                  data={chartData}
                  dataKey="value"
                  colorFn={d => d.value > 0 ? '#ef4444' : '#22c55e'}
                  height={100}
                />
              ),
            }}));
          } catch(e) { setModuleErrors(prev => ({...prev, M9:e.message})); }
          finally    { setModuleLoading(prev => ({...prev, M9:false})); }
        };

        await Promise.allSettled([processM0(), processM1(), processM2(), processM3(), processM4M5(), processM6(), processM7(), processM8(), processM10(), processM11(), processM12(), processRevenue()]);

        const now = new Date();
        setLastUpdated(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`);
        setIsRefreshing(false);
      };

      useEffect(() => { fetchAllData(); }, []);

      const calculateScore = () => {
        let totalScore = 0, validWeights = 0;
        Object.keys(MODULE_CONFIG).forEach(key => {
          if (moduleData[key] && !moduleLoading[key] && !moduleErrors[key]) {
            const points = moduleData[key].status === 'green' ? 100 : moduleData[key].status === 'yellow' ? 50 : 0;
            totalScore   += points * MODULE_CONFIG[key].weight;
            validWeights += MODULE_CONFIG[key].weight;
          }
        });
        if (validWeights === 0) return null;
        let score = Math.round(totalScore / validWeights);
        // M8 × M9 同向加權修正（±5 分）
        const m7ok = moduleData.M8 && !moduleLoading.M8 && !moduleErrors.M8;
        const m8ok = moduleData.M9 && !moduleLoading.M9 && !moduleErrors.M9;
        if (m7ok && m8ok) {
          if (moduleData.M8.status === 'green' && moduleData.M9.status === 'green') score = Math.min(100, score + 5);
          if (moduleData.M8.status === 'red'   && moduleData.M9.status === 'red')   score = Math.max(0,   score - 5);
        }
        return score;
      };

      const isAllExpanded = Object.values(expandedCards).every(Boolean);
      const handleToggleAll = () => {
        const v = !isAllExpanded;
        setExpandedCards({ M1:v, M2:v, M3:v, M4:v, M5:v, M6:v, M7:v, M8:v, M9:v, M10:v, M11:v, M12:v });
      };

      const score = calculateScore();
      const currentLabel = score !== null ? (SCORE_LABELS.find(l => score >= l.min) || SCORE_LABELS[4]) : null;

      return (
        <div className="min-h-screen bg-gray-900 text-white font-sans">
          <div className="max-w-6xl mx-auto px-4 py-8">

            {/* Header */}
            <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 pb-6 border-b border-gray-800">
              <div>
                <h1 className="text-3xl font-bold flex items-center gap-3">
                  <Icons.Activity className="text-green-500" size={32} />
                  台股多空雷達
                </h1>
                <p className="text-gray-400 mt-2 text-sm flex items-center gap-2">
                  <span>基於 FinMind 與 Yahoo 歷史資料計算</span>
                  <button
                    onClick={() => setShowTokenInput(!showTokenInput)}
                    className="text-blue-400 hover:text-blue-300 text-xs px-2 py-1 bg-blue-900/30 rounded border border-blue-800 flex items-center gap-1 transition-colors"
                  >
                    {token === DEFAULT_FINMIND_TOKEN
                      ? <><Icons.CheckCircle2 size={12} className="text-green-400" /> 已啟用專屬 Token</>
                      : <><Icons.Key size={12} /> 自訂 Token</>}
                  </button>
                </p>
                {showTokenInput && (
                  <div className="mt-3 flex flex-wrap items-center gap-2 animate-in bg-gray-800 p-3 rounded border border-gray-700">
                    <input
                      type="password"
                      value={token}
                      onChange={e => saveToken(e.target.value)}
                      placeholder="輸入 FinMind Token"
                      className="bg-gray-900 border border-gray-600 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-green-500 w-full sm:w-64 md:w-96"
                    />
                    <button onClick={fetchAllData} className="bg-green-600 hover:bg-green-500 px-4 py-1.5 rounded text-sm transition-colors text-white">
                      套用並重整
                    </button>
                  </div>
                )}
              </div>
              <div className="flex items-center gap-4 bg-gray-800 px-4 py-2 rounded-lg border border-gray-700 w-full md:w-auto justify-between md:justify-start">
                <div className="text-sm">
                  <span className="text-gray-400 block">資料結算至</span>
                  <span className="font-mono text-gray-200">{lastUpdated || '載入中...'}</span>
                </div>
                <button
                  onClick={fetchAllData}
                  disabled={isRefreshing}
                  className="p-2 bg-gray-700 hover:bg-gray-600 rounded-md transition-colors disabled:opacity-50"
                  title="重新抓取最新資料"
                >
                  <Icons.RefreshCw size={18} className={isRefreshing ? 'animate-spin' : ''} />
                </button>
              </div>
            </header>

            {/* 綜合評分 */}
            <section className="mb-6 bg-gray-800 p-8 rounded-2xl border border-gray-700 shadow-2xl flex flex-col md:flex-row items-center justify-between gap-8">
              <div className="text-center md:text-left w-full md:w-auto">
                <h2 className="text-gray-400 text-lg mb-2">大盤綜合多空評分</h2>
                <div className="flex items-baseline gap-4 justify-center md:justify-start">
                  <span className={`text-7xl font-black ${score !== null ? currentLabel.color : 'text-gray-600'}`}>
                    {score !== null ? score : '--'}
                  </span>
                  <span className="text-2xl text-gray-500 font-medium">/ 100</span>
                </div>
              </div>
              <div className="flex flex-col items-center md:items-end gap-3 w-full md:w-auto">
                <div className="flex items-center gap-3 bg-gray-900/50 px-6 py-3 rounded-full border border-gray-700">
                  {score !== null ? (
                    <>
                      <TrafficLight status={score >= 60 ? 'green' : score >= 40 ? 'yellow' : 'red'} />
                      <span className={`text-2xl font-bold ${currentLabel.color}`}>{currentLabel.label}</span>
                    </>
                  ) : (
                    <span className="text-gray-500">等待資料載入...</span>
                  )}
                </div>
                <div className="w-full max-w-xs md:w-64 h-2 bg-gray-700 rounded-full overflow-hidden flex relative">
                  <div className="h-full w-1/5" style={{backgroundColor:'#22c55e'}}></div>
                  <div className="h-full w-1/5" style={{backgroundColor:'#4ade80'}}></div>
                  <div className="h-full w-1/5" style={{backgroundColor:'#eab308'}}></div>
                  <div className="h-full w-1/5" style={{backgroundColor:'#f87171'}}></div>
                  <div className="h-full w-1/5" style={{backgroundColor:'#ef4444'}}></div>
                  {score !== null && (
                    <div
                      className="absolute top-0 bottom-0 w-1 bg-white transition-all duration-700"
                      style={{ left:`${score}%`, boxShadow:'0 0 5px white' }}
                    />
                  )}
                </div>
              </div>
            </section>

            {/* 下車警示 */}
            <ExitSignalBlock score={score} moduleData={moduleData} revData={revData} />

            {/* 全部展開/收折 */}
            <div className="flex justify-end gap-2 mb-4">
              <button
                onClick={handleToggleAll}
                className="flex items-center gap-2 px-4 py-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-lg text-sm text-gray-300 transition-colors"
              >
                {isAllExpanded
                  ? <><Icons.ChevronUp size={16} /> 全部收折</>
                  : <><Icons.ChevronDown size={16} /> 全部展開</>}
              </button>
            </div>

            {/* 模組 Grid */}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {Object.keys(MODULE_CONFIG).map(key => (
                <ModuleCard
                  key={key}
                  id={key}
                  data={moduleData[key]}
                  loading={moduleLoading[key]}
                  error={moduleErrors[key]}
                  isExpanded={expandedCards[key]}
                  onToggle={() => setExpandedCards(prev => ({...prev, [key]: !prev[key]}))}
                  allModuleData={moduleData}
                />
              ))}
            </div>

            {/* 對齊圖表面板 */}
            <div className="mt-6"><AlignedChartPanel moduleData={moduleData} /></div>

            {/* 錯誤提示 */}
            {Object.values(moduleErrors).some(Boolean) && (
              <div className="mt-8 p-4 bg-red-900/20 border border-red-800 rounded-lg text-sm text-red-300">
                <p className="font-bold mb-1">
                  <Icons.AlertCircle size={16} className="inline mr-1" /> 部分資料取回失敗
                </p>
                <p>若依然顯示錯誤，可能是 FinMind 歷史資料區間維護或 Yahoo API 擋阻。系統已啟動防呆機制，暫不將失敗項目計入總分評估。</p>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
